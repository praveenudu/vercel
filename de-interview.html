<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data engineering interview bank</title>
<meta name="description" content="Scenario-based interview questions and answers for Spark, Delta Lake, DLT, Snowflake, SQL, AI engineering, architecture tracks (Lambda/Kappa, warehouse, medallion), AWS and incidents.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5f6; --panel:#ffffff; --ink:#0f1c27; --muted:#56667a; --line:#d9e0e5;
  --rail:#10243a; --rail-ink:#d7e2ee; --rail-muted:#8ea3b8; --signal:#f0b429;
  --code:#0c1822; --code-ink:#dbe7f2; --focus:#1c6dd0;
  --c-spark:#d9622b; --c-delta:#1f78b4; --c-dlt:#6a51a3; --c-snow:#2aa5c9; --c-sql:#2f8f5b; --c-ai:#c2417a; --c-arch:#8a6d1a; --c-practice:#56667a; --c-answer-framework:#56667a; --c-track-a-batch-streaming:#e07b39; --c-track-b-warehouse:#1f78b4; --c-track-c-medallion:#6a51a3; --c-aws-track:#c77c0e; --c-incident-scenarios:#c2417a; --c-architecture-comparison:#2f8f5b; --c-tools-aws-glue-airflow:#c77c0e; --c-tools-databricks:#d9534f; --c-tools-snowflake:#2aa5c9; --c-tools-cheat-sheet:#56667a; 
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0b141d;--panel:#122030;--ink:#e6eef6;--muted:#93a6ba;--line:#243649;--rail:#08111a;--code:#070f16;}
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Schibsted Grotesk",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{display:grid;grid-template-columns:288px minmax(0,1fr);min-height:100vh}
.rail{background:var(--rail);color:var(--rail-ink);padding:28px 20px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-size:19px;font-weight:700;line-height:1.25;margin:0 0 4px;color:#fff}
.sub{margin:0 0 20px;color:var(--rail-muted);font-size:14px}
.search{width:100%;padding:10px 12px;border-radius:6px;border:1px solid #2a4260;background:#0b1b2d;color:#fff;font:inherit;font-size:15px}
.search::placeholder{color:var(--rail-muted)}
.nav{list-style:none;margin:18px 0 0;padding:0}
.nav button{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;cursor:pointer;font-size:15px;color:var(--rail-ink)}
.nav button:hover{background:#1a3350}
.nav button[aria-current="true"]{background:#1d3857;color:#fff;box-shadow:inset 3px 0 0 var(--signal)}
.dot{width:10px;height:10px;border-radius:2px;flex:none;background:var(--col,#888)}
.nav .n{margin-left:auto;font:12px "JetBrains Mono",monospace;color:var(--rail-muted)}
.progress{margin-top:22px;padding-top:16px;border-top:1px solid #23405f;font-size:13px;color:var(--rail-muted)}
.bar{height:6px;border-radius:3px;background:#1a3350;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--signal);transition:width .3s}
main{padding:36px clamp(16px,4vw,56px) 80px;max-width:980px;width:100%}
h1{font-size:clamp(26px,3.4vw,36px);line-height:1.15;margin:0 0 6px;letter-spacing:-.01em}
.lede{color:var(--muted);margin:0 0 24px;max-width:62ch}
.tools{display:flex;gap:10px;margin:0 0 18px;flex-wrap:wrap}
.btn{font:inherit;font-size:14px;padding:7px 12px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin:8px 0 28px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--col);border-radius:6px;padding:14px 16px}
.tile:hover{border-color:var(--col)}
.tile h3{margin:0 0 4px;font-size:17px}
.tile p{margin:0;color:var(--muted);font-size:14px}
.model{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 20px 8px}
.model h2{font-size:18px}
details.q{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--col);border-radius:6px;margin:0 0 10px}
details.q>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;font-weight:600}
details.q>summary::-webkit-details-marker{display:none}
details.q>summary::before{content:"+";font:500 18px/1.3 "JetBrains Mono",monospace;color:var(--muted);width:14px;flex:none}
details.q[open]>summary::before{content:"–"}
.qt{flex:1}
.crumb{font-weight:400;font-size:13px;color:var(--muted);display:block}
.done{margin-left:auto;font-weight:400;font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;white-space:nowrap}
.body{padding:0 20px 16px 42px;border-top:1px solid var(--line)}
.body p,.body li{max-width:74ch}
.body h2,.body h3{font-size:16px}
.body table{border-collapse:collapse;width:100%;font-size:14px;margin:12px 0;display:block;overflow-x:auto}
.body th,.body td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.body th{background:var(--bg)}
pre{position:relative;background:var(--code);color:var(--code-ink);padding:14px 16px;border-radius:6px;overflow:auto;font:13.5px/1.55 "JetBrains Mono",monospace;margin:12px 0}
code{font-family:"JetBrains Mono",monospace;font-size:.9em}
:not(pre)>code{background:var(--bg);padding:1px 5px;border-radius:4px;border:1px solid var(--line)}
.copy{position:absolute;top:8px;right:8px;font:12px "Schibsted Grotesk",sans-serif;padding:3px 8px;border-radius:4px;border:1px solid #35516d;background:#12263a;color:#cfe0f0;cursor:pointer}
.empty{padding:40px 0;color:var(--muted)}
@media (max-width:820px){
  .app{display:block}
  .rail{position:static;height:auto;padding:18px 16px}
  .nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
  .nav li{flex:none}
  .nav button{white-space:nowrap;border:1px solid #2a4260}
  .progress{display:none}
  .body{padding-left:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <h2 class="brand">Data engineering interview bank</h2>
    <p class="sub">Scenario questions on ecommerce order data</p>
    <label for="s" class="sr" style="position:absolute;left:-9999px">Search questions</label>
    <input id="s" class="search" type="search" placeholder="Search skew, MERGE, clustering…" autocomplete="off">
    <ul class="nav" id="nav"></ul>
    <div class="progress"><span id="ptxt"></span><div class="bar"><i id="pbar"></i></div></div>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>
<script>
const DATA = {"intro": "<pre><code>orders      (order_id, customer_id, product_id, order_date, quantity, amount, status, updated_at)\ncustomers   (customer_id, name, email, region, signup_date)\nproducts    (product_id, name, category, price)\n<\/code><\/pre>\n<p>Scale assumption: 2 billion order rows, ~50M customers, ~200K products, 5 years of history, ~8M new/changed orders per day. Skew: a few \"guest checkout\" and B2B customers hold millions of orders; Black Friday spikes volume 10x.<\/p>\n<p><strong>How to answer any scenario (STAR-D):<\/strong> Situation → Diagnose (what do I check first?) → Action (concrete fix with code/config) → Result (number you'd expect) → Distinguish (when the fix is wrong).<\/p>", "cats": [{"id": "spark", "name": "Spark", "items": [{"q": "S1. Data skew", "a": "<p><strong>Scenario:<\/strong> The nightly job <code>orders JOIN customers ON customer_id<\/code> has 199 tasks finishing in 40 seconds and one task running for 50 minutes. Spark UI shows that task reading 300x more data than the median.<\/p>\n<p><strong>Diagnose:<\/strong> Spark UI → Stages → task duration/shuffle-read summary (max vs median). Then <code>orders.groupBy(\"customer_id\").count().orderBy(desc(\"count\")).show(20)<\/code> to find hot keys. Typical culprit: <code>customer_id = 'GUEST'<\/code> or NULL.<\/p>\n<p><strong>Fixes (in order of effort):<\/strong><\/p>\n<ol>\n<li><strong>AQE skew join<\/strong> (Spark 3+): <code>spark.sql.adaptive.enabled=true<\/code>, <code>spark.sql.adaptive.skewJoin.enabled=true<\/code>, tune <code>skewedPartitionFactor<\/code> (default 5) and <code>skewedPartitionThresholdInBytes<\/code> (default 256MB). Zero code change.<\/li>\n<li><strong>Isolate the hot keys:<\/strong> filter hot keys out, broadcast-join them, regular-join the rest, <code>union<\/code>.<\/li>\n<li><strong>Salting:<\/strong> add random salt 0..N to the big side, explode the small side N times.<\/li>\n<\/ol>\n<pre><code class=\"language-python\">from pyspark.sql import functions as F\nN = 16\nbig   = orders.withColumn(&quot;salt&quot;, (F.rand()*N).cast(&quot;int&quot;))\nsmall = customers.withColumn(&quot;salt&quot;, F.explode(F.array([F.lit(i) for i in range(N)])))\njoined = big.join(small, [&quot;customer_id&quot;, &quot;salt&quot;]).drop(&quot;salt&quot;)\n<\/code><\/pre>\n<ol>\n<li><strong>Handle NULL keys:<\/strong> NULLs never match in a join but all hash to one partition — filter them before the join and union back.<\/li>\n<\/ol>\n<p><strong>Distinguish:<\/strong> Salting multiplies the small side by N — wasteful if the small side is already large. AQE only helps for sort-merge joins, not aggregations; for skewed <code>groupBy<\/code>, use two-stage aggregation (salted partial sum, then final sum).<\/p>\n<p><strong>Follow-up:<\/strong> <em>\"How do you detect skew before it hits production?\"<\/em> → Alert when <code>max task duration / median &gt; 5<\/code> using Spark listener metrics or Databricks job metrics.<\/p>"}, {"q": "S2. Broadcast join — when to use and when to avoid", "a": "<p><strong>Scenario:<\/strong> Join 2B orders with a 200K-row products table, then later with a 50M-row customers table. Which do you broadcast?<\/p>\n<p><strong>Answer:<\/strong> Broadcast products (~50 MB) — it removes the shuffle of the 2B-row side entirely. Do <strong>not<\/strong> broadcast customers (50M rows, several GB): it gets collected on the driver, replicated to every executor, and causes driver OOM or executor memory pressure.<\/p>\n<p><strong>Config:<\/strong> <code>spark.sql.autoBroadcastJoinThreshold<\/code> (default 10 MB; raise to 100–200 MB deliberately), or hint <code>F.broadcast(products)<\/code>. AQE can convert a sort-merge join to broadcast at runtime if post-filter size is small (<code>spark.sql.adaptive.autoBroadcastJoinThreshold<\/code>).<\/p>\n<p><strong>Avoid broadcast when:<\/strong> (a) table is large or stats are stale and estimate is wrong, (b) the join is a full/right outer on the broadcast side, (c) driver memory is small, (d) many concurrent broadcasts hit <code>spark.sql.broadcastTimeout<\/code> (default 300s).<\/p>"}, {"q": "S3. Lazy evaluation", "a": "<p><strong>Scenario:<\/strong> A teammate says \"my <code>filter<\/code> ran instantly but <code>count()<\/code> takes 20 minutes — Spark is broken.\"<\/p>\n<p><strong>Answer:<\/strong> Transformations (<code>filter<\/code>, <code>select<\/code>, <code>join<\/code>) only build a logical plan (DAG). Nothing runs until an <strong>action<\/strong> (<code>count<\/code>, <code>write<\/code>, <code>collect<\/code>, <code>show<\/code>). Benefits: Catalyst can <strong>reorder, push down predicates, prune columns, and fuse stages<\/strong> across the whole plan; lineage enables fault recovery by recomputation.<\/p>\n<p><strong>Gotcha to mention:<\/strong> A DataFrame used by two actions is recomputed twice → <code>cache()<\/code>/<code>persist()<\/code> only if reused and expensive. <code>df.explain(\"formatted\")<\/code> shows what will actually run (look for <code>PushedFilters<\/code>, <code>PartitionFilters<\/code>).<\/p>"}, {"q": "S4. High executor memory / OOM", "a": "<p><strong>Scenario:<\/strong> Executors die with <code>java.lang.OutOfMemoryError<\/code> or \"Container killed by YARN/K8s for exceeding memory limits\" while aggregating orders by customer.<\/p>\n<p><strong>Diagnose order:<\/strong><\/p>\n<ol>\n<li>Is it <strong>heap<\/strong> OOM or <strong>container (off-heap/overhead)<\/strong> kill? Container kill → raise <code>spark.executor.memoryOverhead<\/code> (PySpark UDFs/pandas need more; default max(384MB, 10%)).<\/li>\n<li>Too-large partitions? Target 128–256 MB per partition. <code>spark.sql.shuffle.partitions<\/code> default 200 is too low for TBs → use <code>auto<\/code>/AQE coalescing (<code>spark.sql.adaptive.coalescePartitions.enabled<\/code>).<\/li>\n<li><code>collect()<\/code>, <code>toPandas()<\/code>, or giant broadcast on driver/executor?<\/li>\n<li>Skewed key (see S1).<\/li>\n<li>Python UDFs → replace with built-in functions or pandas UDFs (Arrow).<\/li>\n<\/ol>\n<p><strong>Config baseline (example for 64 GB / 16-core nodes):<\/strong><\/p>\n<pre><code>spark.executor.cores=5\nspark.executor.memory=18g\nspark.executor.memoryOverhead=3g\nspark.memory.fraction=0.6\nspark.sql.shuffle.partitions=auto   # or ~2-3x total cores\nspark.sql.adaptive.enabled=true\nspark.serializer=org.apache.spark.serializer.KryoSerializer\n<\/code><\/pre>\n<p>Why 5 cores: beyond ~5 concurrent tasks per executor, HDFS/S3 I/O throughput per task degrades and GC pressure grows.<\/p>"}, {"q": "S5. groupBy vs reduceByKey", "a": "<p><strong>Scenario:<\/strong> Total revenue per product on the RDD API.<\/p>\n<p><strong>Answer:<\/strong> <code>reduceByKey<\/code> does a <strong>map-side combine<\/strong> (partial sums per partition) before the shuffle, so far less data crosses the network. <code>groupByKey<\/code>/RDD <code>groupBy<\/code> ships every record then aggregates, and can OOM on hot keys. In <strong>DataFrames<\/strong> this distinction disappears: <code>df.groupBy(\"product_id\").agg(F.sum(\"amount\"))<\/code> already uses partial aggregation via Catalyst — prefer DataFrames. Avoid <code>collect_list<\/code> aggregations on large groups for the same reason.<\/p>"}, {"q": "S6. Small files problem", "a": "<p><strong>Scenario:<\/strong> Streaming ingestion writes every minute; a downstream query over one month takes 10 minutes just listing/opening 400,000 files of 200 KB.<\/p>\n<p><strong>Fix:<\/strong> Delta <code>OPTIMIZE<\/code> (bin-packing to ~1 GB target), auto-compaction + optimized writes (<code>delta.autoOptimize.optimizeWrite=true<\/code>, <code>delta.autoOptimize.autoCompact=true<\/code>), coarser trigger interval, <code>repartition<\/code>/<code>coalesce<\/code> before write, don't over-partition (partition by <code>order_date<\/code> month, not by <code>customer_id<\/code>).<\/p>"}, {"q": "S7. Spark config cheat-sheet question", "a": "<p><strong>\"Walk me through sizing a cluster for a 500 GB daily batch.\"<\/strong><\/p>\n<ol>\n<li>Input 500 GB at 128 MB partitions ≈ 4,000 input tasks. Pick cores from the SLA, not the task count: with 200 cores and ~1 min per task, one stage takes about 4,000 × 1 min / 200 ≈ 20 min.<\/li>\n<li>At 5 cores/executor that is 40 executors; memory ≈ 4 GB per core → ~20 GB executor heap + overhead.<\/li>\n<li>Shuffle-heavy? Add local SSD / larger <code>spark.sql.shuffle.partitions<\/code> (shuffle size ÷ 128–200 MB).<\/li>\n<li>Validate with a 10% sample, measure spill (UI \"Spill (disk)\"), then adjust.<\/li>\n<li>Use autoscaling with a min that handles the baseline; enable AQE and dynamic allocation.<\/li>\n<\/ol>"}]}, {"id": "delta-lake", "name": "Delta Lake", "items": [{"q": "D1. Deduplicate and keep the latest order (MERGE)", "a": "<p><strong>Scenario:<\/strong> The source sends the same <code>order_id<\/code> multiple times with different <code>updated_at<\/code>. Keep only the latest and handle late-arriving updates idempotently.<\/p>\n<pre><code class=\"language-sql\">MERGE INTO silver.orders t\nUSING (\n  SELECT * FROM bronze.orders_batch\n  QUALIFY ROW_NUMBER() OVER (PARTITION BY order_id ORDER BY updated_at DESC) = 1\n) s\nON t.order_id = s.order_id\nWHEN MATCHED AND s.updated_at &gt; t.updated_at THEN UPDATE SET *\nWHEN NOT MATCHED THEN INSERT *;\n<\/code><\/pre>\n<p><strong>Key points:<\/strong> dedupe the <em>source batch first<\/em> (MERGE fails with \"multiple source rows matched\" otherwise); the <code>updated_at<\/code> guard makes it idempotent and safe for out-of-order data; include a partition/Z-order predicate in the <code>ON<\/code> clause (e.g., <code>t.order_date &gt;= current_date() - 7<\/code> when you know changes are recent) to avoid scanning the whole table.<\/p>"}, {"q": "D2. Query is slow on WHERE customer_id = ?", "a": "<p><strong>Scenario:<\/strong> Support looks up one customer's orders; table is partitioned by <code>order_date<\/code> and scans everything.<\/p>\n<p><strong>Answer:<\/strong> Partition pruning doesn't help for <code>customer_id<\/code>. Use <strong>data skipping<\/strong> via file-level min/max stats — only works if data is <em>clustered<\/em> by that column:<\/p>\n<ul>\n<li><code>OPTIMIZE orders ZORDER BY (customer_id)<\/code> (older approach), or<\/li>\n<li><strong>Liquid Clustering<\/strong>: <code>ALTER TABLE orders CLUSTER BY (customer_id, order_date)<\/code> — incremental, changeable without rewriting, replaces partitioning + ZORDER for most new tables.<\/li>\n<li>Optionally a bloom filter index for very high-cardinality point lookups.<\/li>\n<\/ul>\n<p><strong>Distinguish:<\/strong> Don't Z-order on &gt;3–4 columns (effectiveness drops); don't partition on high-cardinality columns (small files).<\/p>"}, {"q": "D3. Time travel, RESTORE, VACUUM", "a": "<p><strong>Scenario:<\/strong> A bad job overwrote yesterday's data at 2 PM.<\/p>\n<pre><code class=\"language-sql\">DESCRIBE HISTORY silver.orders;\nSELECT count(*) FROM silver.orders VERSION AS OF 412;\nRESTORE TABLE silver.orders TO VERSION AS OF 412;\n<\/code><\/pre>\n<p><strong>Trade-off:<\/strong> <code>VACUUM<\/code> removes files older than the retention (default 7 days) → time travel beyond that is gone. Never set retention to 0 hours on tables with concurrent readers/streams. Keep <code>delta.logRetentionDuration<\/code> ≥ <code>delta.deletedFileRetentionDuration<\/code>.<\/p>"}, {"q": "D4. Schema evolution", "a": "<p><strong>Scenario:<\/strong> Source adds <code>coupon_code<\/code> column.\nOptions: <code>.option(\"mergeSchema\",\"true\")<\/code> on write, or <code>spark.databricks.delta.schema.autoMerge.enabled=true<\/code> for MERGE. Strict mode (default) rejects the write — good for bronze→silver contracts. Mention column mapping (<code>delta.columnMapping.mode=name<\/code>) to rename/drop columns without rewriting files.<\/p>"}, {"q": "D5. Change Data Feed → incremental gold", "a": "<p><strong>Scenario:<\/strong> Recompute daily revenue incrementally instead of scanning 2B rows.\nEnable <code>delta.enableChangeDataFeed=true<\/code>; read <code>table_changes('silver.orders', start_version)<\/code>; process <code>_change_type<\/code> in (<code>insert<\/code>, <code>update_postimage<\/code>, <code>delete<\/code>) and apply to the aggregate table via MERGE. Cost drops from O(table) to O(changes).<\/p>"}, {"q": "D6. Concurrent writers", "a": "<p><strong>Scenario:<\/strong> Two jobs <code>MERGE<\/code> into the same table and one fails with <code>ConcurrentAppendException<\/code>.\nDelta uses <strong>optimistic concurrency<\/strong>; conflicts occur when both touch overlapping files. Fix: make the writers touch disjoint partitions/clusters and put that in the <code>ON<\/code> predicate, enable row-level concurrency / deletion vectors (DBR 14+), or serialize via orchestration + retry with backoff.<\/p>"}]}, {"id": "delta-live-tables", "name": "Delta Live Tables", "items": [{"q": "L1. Medallion with data-quality expectations", "a": "<p><strong>Scenario:<\/strong> Bad orders (null <code>customer_id<\/code>, negative <code>amount<\/code>) must not poison revenue reports, but you also need an audit of what was rejected.<\/p>\n<pre><code class=\"language-python\">import dlt\nfrom pyspark.sql import functions as F\n\n@dlt.table\ndef bronze_orders():\n    return (spark.readStream.format(&quot;cloudFiles&quot;)\n            .option(&quot;cloudFiles.format&quot;, &quot;json&quot;)\n            .load(&quot;s3://lake/raw/orders/&quot;))\n\n@dlt.table\n@dlt.expect_or_drop(&quot;valid_customer&quot;, &quot;customer_id IS NOT NULL&quot;)\n@dlt.expect_or_drop(&quot;valid_amount&quot;, &quot;amount &gt;= 0&quot;)\n@dlt.expect(&quot;recent_date&quot;, &quot;order_date &gt;= '2020-01-01'&quot;)   # warn only\ndef silver_orders():\n    return dlt.read_stream(&quot;bronze_orders&quot;).select(\n        &quot;order_id&quot;, &quot;customer_id&quot;, &quot;product_id&quot;,\n        F.to_date(&quot;order_date&quot;).alias(&quot;order_date&quot;), &quot;quantity&quot;, &quot;amount&quot;, &quot;updated_at&quot;)\n<\/code><\/pre>\n<p><strong>Expectation modes:<\/strong> <code>expect<\/code> (log metric, keep row) · <code>expect_or_drop<\/code> (drop row) · <code>expect_or_fail<\/code> (fail the update). Metrics land in the pipeline event log → build a data-quality dashboard on it. Quarantine pattern: a second table with the inverse condition.<\/p>"}, {"q": "L2. CDC / SCD with APPLY CHANGES", "a": "<p><strong>Scenario:<\/strong> Customer table changes (address, tier). Need Type 1 current view and Type 2 history.<\/p>\n<pre><code class=\"language-python\">dlt.create_streaming_table(&quot;silver_customers&quot;)\ndlt.apply_changes(\n    target=&quot;silver_customers&quot;, source=&quot;bronze_customers_cdc&quot;,\n    keys=[&quot;customer_id&quot;], sequence_by=&quot;updated_at&quot;,\n    apply_as_deletes=F.expr(&quot;op = 'DELETE'&quot;),\n    stored_as_scd_type=2)          # 1 = overwrite, 2 = keep history\n<\/code><\/pre>\n<p><code>sequence_by<\/code> handles out-of-order events — this is what interviewers listen for.<\/p>"}, {"q": "L3. Streaming table vs Materialized view", "a": "<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Streaming table<\/th>\n<th>Materialized view<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Source<\/td>\n<td>append-only streams<\/td>\n<td>any query incl. joins/aggs<\/td>\n<\/tr>\n<tr>\n<td>Processing<\/td>\n<td>each row once<\/td>\n<td>incremental refresh when possible, else full<\/td>\n<\/tr>\n<tr>\n<td>Use for<\/td>\n<td>bronze/silver ingestion<\/td>\n<td>gold aggregates (revenue by product/day)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"q": "L4. Triggered vs continuous; cost", "a": "<p>Triggered (scheduled) = cheapest, minutes latency; Continuous = seconds latency, cluster always on. Use Enhanced Autoscaling; development mode for fast iteration; use <code>pipelines.reset.allowed=false<\/code> on bronze to avoid accidental full refresh.<\/p>"}, {"q": "L5. Full refresh gone wrong", "a": "<p><strong>Scenario:<\/strong> Someone ran full refresh and bronze source files were already archived.\nAnswer: protect with <code>pipelines.reset.allowed=false<\/code>; keep raw files (retention), rely on Auto Loader checkpoint; select-tables refresh instead of full pipeline.<\/p>"}]}, {"id": "snowflake-performance", "name": "Snowflake performance", "items": [{"q": "SF1. Which optimisation when? (the classic)", "a": "<p><strong>Scenario:<\/strong> <code>orders<\/code> table (2B rows). Five problem queries:<\/p>\n<table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>Tool<\/th>\n<th>Why<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Range filter on <code>order_date<\/code> scans most micro-partitions (<code>partitions scanned ≈ partitions total<\/code>)<\/td>\n<td><strong>Clustering key<\/strong> <code>CLUSTER BY (order_date, customer_id)<\/code><\/td>\n<td>Re-organises micro-partitions so min/max pruning works. Check with <code>SYSTEM$CLUSTERING_INFORMATION<\/code>. Use on multi-TB tables, filtered by the same columns, mostly read, rarely updated.<\/td>\n<\/tr>\n<tr>\n<td>Same expensive <code>SUM(amount) GROUP BY product_id, order_date<\/code> dashboard query runs 500x/day<\/td>\n<td><strong>Materialized view<\/strong> (or Dynamic Table)<\/td>\n<td>Precomputes and auto-maintains aggregate. Limits: single table, no joins, limited functions; maintenance credits.<\/td>\n<\/tr>\n<tr>\n<td>Point lookup <code>WHERE order_id = 'X'<\/code> or <code>email LIKE '%@x.com%'<\/code> takes seconds on huge table<\/td>\n<td><strong>Search Optimization Service<\/strong><\/td>\n<td>Builds search access paths for equality/IN/substring/geo; best for selective lookups. Costs storage + maintenance.<\/td>\n<\/tr>\n<tr>\n<td>Many analysts rerun identical dashboards<\/td>\n<td><strong>Result cache<\/strong> (24h, free) + warehouse local-disk cache<\/td>\n<td>Free if SQL text identical, data unchanged, no non-deterministic functions. Don't suspend warehouse too aggressively — it drops local cache.<\/td>\n<\/tr>\n<tr>\n<td>One query spills to remote disk (<code>Bytes spilled to remote storage<\/code> high)<\/td>\n<td><strong>Bigger warehouse<\/strong> (each size doubles memory/compute)<\/td>\n<td>Spilling = memory pressure. Scale <em>up<\/em> for a heavy single query; scale <em>out<\/em> (multi-cluster) for concurrency/queuing.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Plus: <strong>Query Acceleration Service<\/strong> for sporadic large scans, and <strong>Dynamic Tables<\/strong> for declarative incremental pipelines with <code>TARGET_LAG<\/code>.<\/p>"}, {"q": "SF2. Diagnose with Query Profile", "a": "<p>Look at: <strong>Partitions scanned vs total<\/strong> (pruning), <strong>Bytes spilled<\/strong> (local → remote), <strong>exploding joins<\/strong> (output rows ≫ input — missing/incorrect join key), <strong>Most Expensive Nodes<\/strong>, queueing time (<code>QUEUED_OVERLOAD_TIME<\/code> in <code>QUERY_HISTORY<\/code>). Query: <\/p>\n<pre><code class=\"language-sql\">SELECT query_id, total_elapsed_time/1000 sec, partitions_scanned, partitions_total,\n       bytes_spilled_to_remote_storage\nFROM snowflake.account_usage.query_history\nWHERE start_time &gt; dateadd(day,-1,current_timestamp())\nORDER BY total_elapsed_time DESC LIMIT 20;\n<\/code><\/pre>"}, {"q": "SF3. Clustering key — choose well", "a": "<p>Rules: low-to-medium cardinality first, then higher (<code>order_date<\/code> then <code>customer_id<\/code>); max 3–4 columns; wrap high-cardinality (timestamp → <code>TO_DATE(ts)<\/code>). Cost: automatic reclustering consumes credits — don't cluster tables with heavy random DML or &lt; ~1 TB. Alternative: sort data on <code>INSERT ... ORDER BY order_date<\/code> during load (free natural clustering).<\/p>"}, {"q": "SF4. Warehouse sizing & cost", "a": "<p>Auto-suspend 60 s (not 0), auto-resume on, <strong>multi-cluster in <code>STANDARD<\/code> scaling policy only for BI concurrency<\/strong>, separate warehouses for ETL / BI / ad-hoc, resource monitors with credit quotas, <code>STATEMENT_TIMEOUT_IN_SECONDS<\/code> guardrails. Rule: if doubling size halves runtime, it costs the same and finishes sooner — scale up is \"free\" for scan-bound queries.<\/p>"}, {"q": "SF5. Incremental loads", "a": "<p><code>COPY INTO<\/code> (file-level load metadata prevents reloads for 64 days) vs <strong>Snowpipe<\/strong> (continuous, serverless) vs <strong>Snowpipe Streaming<\/strong> (low latency). Upserts: <code>MERGE<\/code>; dedupe: <\/p>\n<pre><code class=\"language-sql\">SELECT * FROM orders\nQUALIFY ROW_NUMBER() OVER (PARTITION BY order_id ORDER BY updated_at DESC) = 1;\n<\/code><\/pre>\n<p>Streams + Tasks for CDC; Dynamic Tables to replace many stream/task pairs.<\/p>"}, {"q": "SF6. Semi-structured JSON orders", "a": "<p><code>VARIANT<\/code> column, <code>LATERAL FLATTEN<\/code> for line items; for hot paths, extract frequently filtered attributes into typed columns (pruning works on typed columns, and Snowflake auto-columnarizes some VARIANT paths but not reliably for all).<\/p>"}]}, {"id": "sql-on-the-order-table", "name": "SQL on the order table", "items": [{"q": "Q1 — Keep the latest record per order", "a": "<pre><code class=\"language-sql\">SELECT * FROM orders\nQUALIFY ROW_NUMBER() OVER (PARTITION BY order_id ORDER BY updated_at DESC) = 1;\n<\/code><\/pre>\n<p>(Databricks supports <code>QUALIFY<\/code> too. On engines without it, wrap in a CTE and <code>WHERE rn = 1<\/code>.)<\/p>"}, {"q": "Q2 — Customers who ordered more than once (repeat buyers)", "a": "<pre><code class=\"language-sql\">WITH d AS (SELECT * FROM orders QUALIFY ROW_NUMBER() OVER (PARTITION BY order_id ORDER BY updated_at DESC)=1)\nSELECT customer_id, COUNT(*) orders, MIN(order_date) first_order, MAX(order_date) last_order\nFROM d GROUP BY customer_id HAVING COUNT(*) &gt; 1;\n<\/code><\/pre>"}, {"q": "Q3 — Top 2 products by revenue per month", "a": "<p>(use <code>DENSE_RANK<\/code> if ties should both appear)<\/p>\n<pre><code class=\"language-sql\">WITH m AS (SELECT DATE_TRUNC('month', order_date) mth, product_id, SUM(amount) rev FROM d GROUP BY 1,2)\nSELECT * FROM m QUALIFY DENSE_RANK() OVER (PARTITION BY mth ORDER BY rev DESC) &lt;= 2;\n<\/code><\/pre>"}, {"q": "Q4 — Days between a customer's consecutive orders", "a": "<pre><code class=\"language-sql\">SELECT customer_id, order_date,\n       DATEDIFF('day', LAG(order_date) OVER (PARTITION BY customer_id ORDER BY order_date), order_date) AS gap_days\nFROM (SELECT DISTINCT customer_id, order_date FROM orders);\n<\/code><\/pre>"}, {"q": "Q5 — Running revenue total", "a": "<pre><code class=\"language-sql\">SELECT order_date, SUM(amount) OVER (ORDER BY order_date ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) running_revenue FROM d;\n<\/code><\/pre>\n<p>Mention <code>ROWS<\/code> vs default <code>RANGE<\/code> (ties on the same date are summed together with RANGE).<\/p>"}, {"q": "Q6 — Customers inactive for 90 days (churn candidates)", "a": "<p><code>HAVING MAX(order_date) &lt; CURRENT_DATE - 90<\/code>.<\/p>"}, {"q": "Q7 — Why is my join returning more rows than expected?", "a": "<p>Duplicate keys on the dimension side → fan-out. Check <code>COUNT(*) vs COUNT(DISTINCT key)<\/code>; dedupe the dimension or aggregate before joining.<\/p>"}]}, {"id": "ai-engineering", "name": "AI engineering", "items": [{"q": "A1. RAG over order-support data", "a": "<p><strong>Scenario:<\/strong> Support agents want \"What happened to order 123?\" and policy answers (returns, shipping).\nDesign: structured facts (order status) come from SQL/tools, <strong>not<\/strong> from embeddings; unstructured policies/tickets → chunk (300–500 tokens, overlap 10–15%), embed, store in a vector index (Databricks Vector Search / pgvector / Snowflake Cortex Search), hybrid retrieval (BM25 + vector) + reranker, cite sources, guardrails for PII. Evaluate with a golden set: retrieval recall@k, answer faithfulness, latency, cost per query.<\/p>"}, {"q": "A2. Text-to-SQL on the orders warehouse", "a": "<p><strong>Scenario:<\/strong> \"Revenue by category last quarter.\"\nGive the model only a <strong>curated semantic layer<\/strong> (table/column descriptions, join paths, metric definitions like \"revenue = SUM(amount) WHERE status='COMPLETE'\"), few-shot examples, read-only role with row limit and statement timeout, validate SQL with <code>EXPLAIN<\/code> before executing, log every query. Biggest risks: wrong metric definition, expensive scans, PII exposure — not syntax.<\/p>"}, {"q": "A3. Feature pipeline for a churn / recommendation model", "a": "<p>Build features (orders_last_30d, avg_basket, days_since_last_order) in Delta/Snowflake with <strong>point-in-time correctness<\/strong> — compute as of the label date to avoid leakage; register in a feature store; same definitions for training and serving; monitor drift (PSI) and data freshness.<\/p>"}, {"q": "A4. LLM pipeline on batch data (cost control)", "a": "<p>Classifying 5M free-text reviews: batch inference (<code>ai_query<\/code>/Cortex functions or async batch API), dedupe identical texts, cache by hash, use a small model first and escalate low-confidence rows, structured JSON output with schema validation, retries with idempotent writes, token budgets per run.<\/p>"}, {"q": "A5. PII implementation (your strength — frame it with a story)", "a": "<p>Tokenize/hash emails at ingestion, column masking policies (Snowflake dynamic masking / Unity Catalog column masks), row-level security by region, tag-based governance, audit logs, never send raw PII to an LLM prompt — mask first.<\/p>"}]}, {"id": "architecture-and-incidents", "name": "Architecture and incidents", "items": [{"q": "Pipeline failed at 3 AM; dashboard shows yesterday's revenue", "a": "<p>Triage: blast radius → rerun idempotently (MERGE/overwrite partition, not append) → root cause → add alert + data freshness SLA + runbook.<\/p>"}, {"q": "Cost doubled this month", "a": "<p>Query history top spenders, warehouse/cluster idle time, small-files, full refreshes, unbounded <code>SELECT *<\/code>, missing auto-suspend; fix with monitors + tagging by team.<\/p>"}, {"q": "Batch vs streaming for orders?", "a": "<p>Business latency requirement decides. Hourly OK → micro-batch (Auto Loader/Snowpipe). Fraud detection → Kafka + Structured Streaming with exactly-once sinks (idempotent writes + checkpoint).<\/p>"}, {"q": "Late-arriving / out-of-order events", "a": "<p>Watermarks (<code>withWatermark(\"event_time\",\"2 hours\")<\/code>), <code>sequence_by<\/code>, upsert on business key with timestamp guard.<\/p>"}, {"q": "Backfill 5 years of history without breaking production", "a": "<p>Separate backfill job by date range, write to staging, validate row counts/checksums, swap/MERGE; throttle clusters.<\/p>"}, {"q": "Data quality ownership", "a": "<p>Contracts at the source, expectations at silver, reconciliation counts bronze→silver→gold, anomaly alerts on volume/null-rate.<\/p>"}]}, {"id": "answer-framework", "name": "Answer framework", "items": [{"q": "Answer framework", "a": "<ol>\n<li><strong>Clarify<\/strong>: event time vs processing time? How late can data be (minutes, days)? SLA? Is the sink idempotent?<\/li>\n<li><strong>Detect<\/strong>: how do we know data is late or bad (watermarks, row counts, freshness checks)?<\/li>\n<li><strong>Contain<\/strong>: stop bad data reaching consumers (quarantine, pause downstream).<\/li>\n<li><strong>Fix<\/strong>: reprocess or backfill, idempotently.<\/li>\n<li><strong>Prevent<\/strong>: contracts, tests, alerts, runbook.<\/li>\n<\/ol>\n<p>Three words to repeat: <strong>idempotent, replayable, observable<\/strong>.<\/p>"}]}, {"id": "track-a-batch-streaming", "name": "Track A: Batch + streaming", "items": [{"q": "Overview", "a": "<p>Stack: Kafka, Spark Structured Streaming, S3, Airflow, a serving store.<\/p>"}, {"q": "Architecture recap", "a": "<ul>\n<li><strong>Lambda architecture<\/strong>: a batch layer (accurate, slow, recomputes everything) plus a speed layer (fast, approximate), merged at a serving layer. Cost: two codebases to keep in sync.<\/li>\n<li><strong>Kappa architecture<\/strong>: one streaming pipeline. Reprocessing means replaying the log (Kafka retention or a tiered/S3 copy) through the same code. Cost: needs long log retention and a replayable source.<\/li>\n<\/ul>"}, {"q": "A1. Late-arriving data", "a": "<p><strong>Scenario<\/strong>: Order events carry <code>event_time<\/code>. Mobile app events arrive up to 3 days late. The daily revenue dashboard is wrong after midnight.<\/p>\n<p><strong>Answer<\/strong>\n- Aggregate on <strong>event time<\/strong>, not arrival time.\n- Streaming: use a <strong>watermark<\/strong> to bound state, and send anything later than the watermark to a <strong>late-data topic or table<\/strong>.\n- Batch layer: a nightly job <strong>recomputes the last N days<\/strong> of partitions (N = max lateness, e.g. 3) and overwrites them. The serving layer prefers batch output over speed output for those days. This is Lambda's built-in correction mechanism.<\/p>\n<pre><code class=\"language-python\">from pyspark.sql import functions as F\n\norders = (spark.readStream.format(&quot;kafka&quot;)\n    .option(&quot;subscribe&quot;, &quot;orders&quot;).load()\n    .select(F.from_json(F.col(&quot;value&quot;).cast(&quot;string&quot;), schema).alias(&quot;o&quot;)).select(&quot;o.*&quot;))\n\nagg = (orders\n    .withWatermark(&quot;event_time&quot;, &quot;3 days&quot;)\n    .groupBy(F.window(&quot;event_time&quot;, &quot;1 day&quot;), &quot;region&quot;)\n    .agg(F.sum(&quot;amount&quot;).alias(&quot;revenue&quot;)))\n\n(agg.writeStream.outputMode(&quot;update&quot;)\n    .option(&quot;checkpointLocation&quot;, &quot;s3://lake/chk/daily_rev&quot;)\n    .foreachBatch(upsert_to_serving)   # MERGE, so it is idempotent\n    .start())\n<\/code><\/pre>\n<p><strong>Interviewer follow-ups<\/strong>\n- <em>Q: What does the watermark actually do?<\/em> A: It tells Spark when a window is final so state can be dropped. Events older than (max event time minus 3 days) are dropped from stateful aggregations. A longer watermark means more state and memory.\n- <em>Q: What about events later than 3 days?<\/em> A: They are not lost: capture them separately (a <code>late_orders<\/code> table) and let the batch correction job pick them up.\n- <em>Q: Why <code>update<\/code> mode?<\/em> A: The same window is revised as late rows arrive. Append mode would only emit a window after the watermark passes, which delays the dashboard.\n- <em>Q: How do you avoid double counting on retry?<\/em> A: Write with <code>MERGE<\/code> on a deterministic key (<code>order_id<\/code>, <code>event_version<\/code>), not blind <code>INSERT<\/code>. Checkpoints give at-least-once; the idempotent sink makes it effectively exactly-once.\n- <em>Q: Lambda or Kappa for this?<\/em> A: Kappa if the source is replayable and retention is long enough, since there is one code path. Lambda if the batch layer needs data the stream never sees (e.g. a corrected finance file).<\/p>"}, {"q": "A2. Data quality exceptions", "a": "<p><strong>Scenario<\/strong>: 2% of events have null <code>order_id<\/code> or a negative <code>amount<\/code>.<\/p>\n<p><strong>Answer<\/strong>\n- Validate at the edge of the stream and <strong>route, don't fail<\/strong>: good rows go on, bad rows go to a <strong>dead-letter queue (DLQ)<\/strong> with the error reason and the raw payload.\n- Alert on the <strong>DLQ rate<\/strong>, not on each bad record.\n- Keep the raw payload so rows can be fixed and replayed.<\/p>\n<pre><code class=\"language-python\">valid = orders.filter(&quot;order_id IS NOT NULL AND amount &gt;= 0&quot;)\nbad = (orders.filter(&quot;order_id IS NULL OR amount &lt; 0&quot;)\n    .withColumn(&quot;dq_reason&quot;, F.when(F.col(&quot;order_id&quot;).isNull(), &quot;null_order_id&quot;)\n                              .otherwise(&quot;negative_amount&quot;)))\nbad.writeStream.format(&quot;delta&quot;).option(&quot;checkpointLocation&quot;,&quot;s3://lake/chk/dlq&quot;) \\\n   .start(&quot;s3://lake/dlq/orders&quot;)\n<\/code><\/pre>\n<p><strong>Follow-ups<\/strong>\n- <em>Q: Why not just drop bad rows?<\/em> A: Silent loss. You can't reconcile counts with the source, and the producer never learns about it.\n- <em>Q: What threshold stops the pipeline?<\/em> A: Hard stop if DLQ rate is above a threshold (e.g. 5%) because that signals an upstream break, not noisy data. Below it, continue and alert.\n- <em>Q: Schema changed upstream. What happens?<\/em> A: Use a schema registry with compatibility rules. Additive columns are fine; breaking changes are rejected at the producer.<\/p>"}, {"q": "A3. Backtracking / backfill", "a": "<p><strong>Scenario<\/strong>: A bug in the discount logic ran for 6 days. Fix it and restate history.<\/p>\n<p><strong>Answer<\/strong>\n- Fix the code, then replay the affected range: in Kappa, reset consumer offsets or replay from S3/tiered storage into a <strong>new job with a new checkpoint<\/strong>; in Lambda, rerun the batch job for those dates.\n- Write results into a <strong>separate target or staging partition<\/strong>, validate against expected totals, then <strong>swap<\/strong> (partition overwrite or table rename). Never backfill in place without a way to roll back.\n- Throttle so the backfill doesn't starve the live stream.<\/p>\n<p><strong>Follow-ups<\/strong>\n- <em>Q: Kafka retention is only 7 days. The bug is 10 days old.<\/em> A: Read the archived raw copy from S3 (a sink connector or the bronze layer). This is why you land raw events durably.\n- <em>Q: How do you stop backfill and live data both writing the same key?<\/em> A: Deterministic keys plus <code>MERGE<\/code> with a version or <code>updated_at<\/code> condition so the newer record wins.\n- <em>Q: How do you prove the backfill is right?<\/em> A: Compare row counts and sums by day against source, and diff old vs new on a sample.<\/p>"}]}, {"id": "track-b-warehouse", "name": "Track B: Warehouse", "items": [{"q": "Overview", "a": "<p>Stack: S3 to Redshift via <code>COPY<\/code>, Postgres (RDS) as source or serving, dbt, Airflow.<\/p>"}, {"q": "B1. Late-arriving data", "a": "<p><strong>Scenario<\/strong>: <code>fact_orders<\/code> is loaded daily. A payments file for last Tuesday arrives on Friday. Also, dimension rows (e.g. a customer) arrive after the fact that references them.<\/p>\n<p><strong>Answer<\/strong>\n- <strong>Late facts<\/strong>: load incrementally by <code>updated_at<\/code>/<code>ingested_at<\/code> high-water mark, plus a <strong>lookback window<\/strong> (reprocess the last 3 days every run). Upsert, so reruns are safe.\n- <strong>Late dimensions (early-arriving facts)<\/strong>: insert a <strong>placeholder dimension row<\/strong> (<code>-1<\/code> or the natural key with <code>unknown<\/code> attributes, marked <code>is_inferred = true<\/code>) so the fact can load, then update it when the real dimension row arrives.\n- Redshift has no true <code>MERGE<\/code> in older versions: use <strong>staging table plus delete-then-insert in one transaction<\/strong>. (Newer Redshift supports <code>MERGE<\/code>.)<\/p>\n<pre><code class=\"language-sql\">BEGIN;\nDELETE FROM fact_orders USING stg_orders s WHERE fact_orders.order_id = s.order_id;\nINSERT INTO fact_orders SELECT * FROM stg_orders;\nCOMMIT;\n<\/code><\/pre>\n<p>Postgres equivalent:<\/p>\n<pre><code class=\"language-sql\">INSERT INTO fact_orders (order_id, amount, updated_at)\nSELECT order_id, amount, updated_at FROM stg_orders\nON CONFLICT (order_id) DO UPDATE\nSET amount = EXCLUDED.amount, updated_at = EXCLUDED.updated_at\nWHERE fact_orders.updated_at &lt; EXCLUDED.updated_at;\n<\/code><\/pre>\n<p><strong>Follow-ups<\/strong>\n- <em>Q: Why a lookback window instead of exactly \"since last run\"?<\/em> A: The high-water mark misses rows that commit with an older timestamp (long transactions, late files). The lookback trades extra reads for correctness.\n- <em>Q: How do you handle SCD2 dimensions when the late record is older than the current version?<\/em> A: Close and reopen version ranges so <code>valid_from/valid_to<\/code> stay contiguous; this is a restatement, so reload the affected fact rows' dimension keys.\n- <em>Q: Redshift <code>DELETE<\/code> leaves dead rows?<\/em> A: Yes, run <code>VACUUM<\/code> and <code>ANALYZE<\/code> after large loads, or rely on auto vacuum; monitor <code>svv_table_info<\/code> unsorted/stats-off.<\/p>"}, {"q": "B2. Data quality exceptions", "a": "<p><strong>Scenario<\/strong>: Duplicate orders and orphaned foreign keys in the nightly load.<\/p>\n<p><strong>Answer<\/strong>\n- Load to <strong>staging<\/strong> first; run checks there: uniqueness, not null, referential integrity, row count vs source manifest, amount sanity ranges.\n- Failures: write offending rows to an <strong>error table<\/strong> (<code>err_orders<\/code> with reason and batch id); only clean rows move to the fact.\n- Use dbt tests (<code>unique<\/code>, <code>not_null<\/code>, <code>relationships<\/code>) and store failures; add a freshness check on source.\n- Dedupe with a window function:<\/p>\n<pre><code class=\"language-sql\">SELECT * FROM (\n  SELECT *, ROW_NUMBER() OVER (PARTITION BY order_id ORDER BY updated_at DESC) rn\n  FROM stg_orders) WHERE rn = 1;\n<\/code><\/pre>\n<p><strong>Follow-ups<\/strong>\n- <em>Q: Redshift doesn't enforce primary keys. How do you guarantee uniqueness?<\/em> A: It's informational only. Enforce through the dedupe step and tests, not constraints.\n- <em>Q: Block the load or load and flag?<\/em> A: Block on critical checks (row count, key uniqueness on facts); load and flag on soft checks (a few unknown categories).<\/p>"}, {"q": "B3. Backtracking / backfill", "a": "<p><strong>Scenario<\/strong>: Restate the last 90 days of <code>fact_orders<\/code> after a currency-conversion bug.<\/p>\n<p><strong>Answer<\/strong>\n- Parameterize the pipeline by date range (<code>start_date<\/code>, <code>end_date<\/code>), so a backfill is the same code as a daily run.\n- Build into a <strong>shadow table<\/strong>, validate, then swap in one transaction:\n  <code>sql\n  BEGIN; ALTER TABLE fact_orders RENAME TO fact_orders_old;\n         ALTER TABLE fact_orders_new RENAME TO fact_orders; COMMIT;<\/code>\n- Airflow: <code>airflow dags backfill<\/code> or clear task instances, with <code>max_active_runs<\/code> limited, and <code>depends_on_past<\/code> considered.\n- Rebuild dependent aggregates and notify BI users that numbers will change.\n- Redshift: use <strong>snapshots<\/strong> before the change (rollback path); Postgres: use a transaction or <code>pg_dump<\/code> of affected partitions; <strong>partition by date<\/strong> so you can drop/reload a partition.<\/p>\n<p><strong>Follow-ups<\/strong>\n- <em>Q: Downstream dashboards cache the old numbers?<\/em> A: Invalidate caches, announce the restatement, and keep a changelog/version of the metric.\n- <em>Q: How do you backfill 90 days without hurting production queries?<\/em> A: Run in a separate WLM queue or concurrency-scaling cluster, in chunks of a few days, off-peak.<\/p>"}]}, {"id": "track-c-medallion", "name": "Track C: Medallion (Delta)", "items": [{"q": "Overview", "a": "<p>Stack: Auto Loader, Delta Lake, Delta Live Tables (DLT) or Structured Streaming, Unity Catalog, Workflows.<\/p>\n<p>Layers: <strong>Bronze<\/strong> (raw, append-only, immutable) then <strong>Silver<\/strong> (cleaned, deduped, conformed) then <strong>Gold<\/strong> (business aggregates).<\/p>"}, {"q": "C1. Late-arriving data", "a": "<p><strong>Scenario<\/strong>: Events land in S3 late and out of order; silver and gold must self-correct.<\/p>\n<p><strong>Answer<\/strong>\n- <strong>Bronze<\/strong> ingests with Auto Loader as soon as files arrive (arrival time = <code>_ingest_ts<\/code>); never filter on lateness here.\n- <strong>Silver<\/strong> uses <code>MERGE INTO<\/code> keyed on business key, with an <code>event_time<\/code>/version condition so older updates never overwrite newer ones.\n- <strong>Gold<\/strong> is recomputed for affected partitions only (incremental, using Change Data Feed to find changed keys) or via DLT materialized views that refresh automatically.<\/p>\n<pre><code class=\"language-sql\">MERGE INTO silver.orders t\nUSING (SELECT * FROM bronze_orders_batch) s\nON t.order_id = s.order_id\nWHEN MATCHED AND s.event_time &gt; t.event_time THEN UPDATE SET *\nWHEN NOT MATCHED THEN INSERT *;\n<\/code><\/pre>\n<pre><code class=\"language-python\">(spark.readStream.format(&quot;delta&quot;)\n  .option(&quot;readChangeFeed&quot;,&quot;true&quot;).table(&quot;silver.orders&quot;)   # drive gold from changes\n  ...)\n<\/code><\/pre>\n<p><strong>Follow-ups<\/strong>\n- <em>Q: Why not just overwrite gold nightly?<\/em> A: It works but wastes compute; CDF lets you touch only changed keys/partitions.\n- <em>Q: Out-of-order updates within one micro-batch?<\/em> A: Dedupe inside the batch first (<code>ROW_NUMBER() ... ORDER BY event_time DESC<\/code>) because <code>MERGE<\/code> fails if multiple source rows match one target row.\n- <em>Q: Small files from late data?<\/em> A: <code>OPTIMIZE<\/code> with Z-order or liquid clustering, plus auto-compaction/optimize write.<\/p>"}, {"q": "C2. Data quality exceptions", "a": "<p><strong>Scenario<\/strong>: Enforce quality between bronze and silver without losing bad rows.<\/p>\n<p><strong>Answer: DLT expectations<\/strong><\/p>\n<pre><code class=\"language-python\">import dlt\n\n@dlt.table\n@dlt.expect_or_drop(&quot;valid_order_id&quot;, &quot;order_id IS NOT NULL&quot;)\n@dlt.expect_or_fail(&quot;non_negative_amount&quot;, &quot;amount &gt;= 0&quot;)\n@dlt.expect(&quot;known_region&quot;, &quot;region IN ('US','EU','APAC')&quot;)   # warn only, keeps row\ndef silver_orders():\n    return dlt.read_stream(&quot;bronze_orders&quot;)\n<\/code><\/pre>\n<ul>\n<li><code>expect<\/code> = record metric, keep row; <code>expect_or_drop<\/code> = drop row; <code>expect_or_fail<\/code> = fail the update.<\/li>\n<li>Dropped rows are recorded in the DLT event log; also route them to a <strong>quarantine table<\/strong> explicitly so they can be repaired.<\/li>\n<li>Delta <strong>CHECK constraints<\/strong> (<code>ALTER TABLE ... ADD CONSTRAINT<\/code>) enforce hard rules on write.<\/li>\n<\/ul>\n<p><strong>Follow-ups<\/strong>\n- <em>Q: Which expectation for which rule?<\/em> A: Fail for rules that mean upstream is broken, drop for bad individual rows, warn for soft issues you want to trend.\n- <em>Q: How do you see quality over time?<\/em> A: Query the DLT event log for expectation pass/fail counts and put them on a dashboard and alert.\n- <em>Q: Schema drift?<\/em> A: Auto Loader <code>schemaEvolutionMode = rescue<\/code> puts unexpected fields into <code>_rescued_data<\/code> instead of failing or silently dropping.<\/p>"}, {"q": "C3. Backtracking / backfill with Delta time travel", "a": "<p><strong>Scenario<\/strong>: A bad silver job corrupted 3 days of data. Roll back and replay.<\/p>\n<p><strong>Answer<\/strong>\n- <strong>Inspect<\/strong>: <code>DESCRIBE HISTORY silver.orders<\/code> to find the bad version.\n- <strong>Recover<\/strong>: <code>RESTORE TABLE silver.orders TO VERSION AS OF 142<\/code> (or <code>TIMESTAMP AS OF<\/code>).\n- <strong>Replay<\/strong>: because bronze is immutable, rerun silver from bronze for the affected range, with the fixed logic. For streaming, use a <strong>new checkpoint<\/strong> and bound the replay by date; for batch, <code>replaceWhere<\/code> on partitions.\n- Compare versions: <code>SELECT * FROM silver.orders VERSION AS OF 141<\/code> vs current to verify.<\/p>\n<pre><code class=\"language-python\">(df.write.format(&quot;delta&quot;).mode(&quot;overwrite&quot;)\n   .option(&quot;replaceWhere&quot;,&quot;order_date &gt;= '2026-10-01' AND order_date &lt; '2026-10-04'&quot;)\n   .saveAsTable(&quot;silver.orders&quot;))\n<\/code><\/pre>\n<p><strong>Follow-ups<\/strong>\n- <em>Q: How far back can you time travel?<\/em> A: Limited by <code>delta.logRetentionDuration<\/code> (default 30 days) and <code>delta.deletedFileRetentionDuration<\/code> (default 7 days). <code>VACUUM<\/code> removes files, after which time travel to those versions fails. Raise retention for critical tables.\n- <em>Q: Restore vs replay from bronze?<\/em> A: Restore is instant but returns to old data (including old late arrivals); replay applies the fixed logic to current bronze. Use restore to stop the bleeding, replay to correct.\n- <em>Q: Does RESTORE affect downstream streams?<\/em> A: Yes. Restore is a new commit; streaming readers may need to handle it (<code>ignoreChanges<\/code> / CDF) or be reset.<\/p>"}]}, {"id": "aws-track", "name": "AWS track", "items": [{"q": "4.1 Reference architecture (ecommerce orders)", "a": "<pre><code>App/API -&gt; Kinesis Data Streams (or MSK) -&gt; Lambda (validate/enrich)\n                                           -&gt; Firehose -&gt; S3 raw (bronze)\nS3 raw -&gt; Glue (Spark ETL) / Glue Catalog -&gt; S3 curated (Parquet)\nS3 curated -&gt; Redshift (COPY / Spectrum)  -&gt; BI\nLambda / DMS -&gt; RDS Postgres (operational / serving)\nOrchestration: Step Functions or MWAA (Airflow). Monitoring: CloudWatch.\n<\/code><\/pre>\n<p>Note: \"Lambda\" has two meanings in interviews: <strong>AWS Lambda<\/strong> (serverless function) and <strong>Lambda architecture<\/strong> (batch + speed). Clarify which one is meant.<\/p>"}, {"q": "4.2 AWS Lambda in the data path", "a": "<p><strong>Scenario<\/strong>: Lambda consumes a Kinesis stream and writes to Postgres. Duplicates and lost events appear.<\/p>\n<p><strong>Answer<\/strong>\n- Kinesis/SQS to Lambda is <strong>at-least-once<\/strong>, so the handler must be <strong>idempotent<\/strong> (upsert by key).\n- Configure <strong><code>ReportBatchItemFailures<\/code><\/strong> so only failed records are retried, not the whole batch.\n- Set <code>BisectBatchOnFunctionError<\/code>, a <strong>max retry<\/strong>, and an <strong>on-failure destination (SQS DLQ)<\/strong> so poison messages don't block a shard.\n- Watch <strong><code>IteratorAge<\/code><\/strong>; a rising value means the consumer is falling behind (late data building up).\n- Postgres connections: use <strong>RDS Proxy<\/strong> to avoid connection exhaustion from many concurrent Lambdas.<\/p>\n<pre><code class=\"language-python\">def handler(event, ctx):\n    failures = []\n    for rec in event[&quot;Records&quot;]:\n        try:\n            order = json.loads(base64.b64decode(rec[&quot;kinesis&quot;][&quot;data&quot;]))\n            upsert(order)   # INSERT ... ON CONFLICT DO UPDATE\n        except Exception:\n            failures.append({&quot;itemIdentifier&quot;: rec[&quot;kinesis&quot;][&quot;sequenceNumber&quot;]})\n    return {&quot;batchItemFailures&quot;: failures}\n<\/code><\/pre>\n<p><strong>Follow-ups<\/strong>\n- <em>Q: 15 minute Lambda limit?<\/em> A: Long backfills don't belong in Lambda; use Glue, EMR, or ECS/Fargate, orchestrated with Step Functions.\n- <em>Q: Cold starts and concurrency?<\/em> A: Reserved concurrency to protect the database; provisioned concurrency if latency matters.\n- <em>Q: Ordering?<\/em> A: Preserved per shard / per partition key (Kinesis) or per message group (SQS FIFO). Pick a key like <code>order_id<\/code>.\n- <em>Q: Kinesis retention is 24 hours by default. How do you replay older data?<\/em> A: Extend retention (up to 365 days) or replay from the S3 raw copy via Firehose.<\/p>"}, {"q": "4.3 Late data and backfill on AWS", "a": "<ul>\n<li><strong>Glue job bookmarks<\/strong> track processed files; for a backfill, <strong>reset the bookmark<\/strong> (or run without bookmarks on a date range) and write with <code>partitionOverwriteMode=dynamic<\/code> so only affected partitions are replaced.<\/li>\n<li><strong>S3 + Athena/Glue<\/strong>: partition by <code>event_date<\/code>; late data lands in old partitions; re-run just those partitions, then <code>MSCK REPAIR TABLE<\/code> or partition projection.<\/li>\n<li><strong>Redshift<\/strong>: <code>COPY<\/code> from the corrected S3 prefix into staging, then swap/merge (see B1/B3). Use a <strong>manifest file<\/strong> so <code>COPY<\/code> loads exactly the intended files.<\/li>\n<li><strong>Redshift Spectrum<\/strong> lets you query late S3 data without loading, as a stopgap.<\/li>\n<li><strong>Step Functions<\/strong> <code>Map<\/code> state for parallel date-range backfill with retry/catch.<\/li>\n<\/ul>"}, {"q": "4.4 Redshift vs Postgres: when to use which", "a": "<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Redshift<\/th>\n<th>RDS/Aurora Postgres<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Workload<\/td>\n<td>OLAP, large scans, columnar<\/td>\n<td>OLTP, point lookups, small transactions<\/td>\n<\/tr>\n<tr>\n<td>Scale<\/td>\n<td>TB to PB<\/td>\n<td>GB to low TB<\/td>\n<\/tr>\n<tr>\n<td>Uniqueness<\/td>\n<td>Not enforced<\/td>\n<td>Enforced (PK, unique)<\/td>\n<\/tr>\n<tr>\n<td>Upsert<\/td>\n<td>Staging + delete/insert (or <code>MERGE<\/code>)<\/td>\n<td><code>ON CONFLICT<\/code><\/td>\n<\/tr>\n<tr>\n<td>Tuning<\/td>\n<td>Dist key, sort key, WLM, vacuum<\/td>\n<td>Indexes, partitioning, vacuum/autovacuum<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Follow-up<\/strong>: <em>Q: Redshift query is slow after a big backfill.<\/em> A: Run <code>ANALYZE<\/code> (stale stats), check skew on the dist key, check unsorted region and <code>VACUUM SORT<\/code>, review the query plan for broadcast joins.<\/p>"}]}, {"id": "incident-scenarios", "name": "Incident scenarios", "items": [{"q": "I1. \"The dashboard shows yesterday's revenue down 40%.\"", "a": "<p><strong>Triage in order<\/strong>\n1. Is it real? Compare with the source system and with the previous days' pattern.\n2. Freshness: did the latest partition/batch land? Check scheduler status and the source's last-modified time.\n3. Volume: row counts per stage (bronze, silver, gold) to find where rows vanish.\n4. Recent change: deployment, schema change, config, upstream release.\n5. Late data: is it simply not arrived yet (check the event time vs arrival time)?<\/p>\n<p><strong>Follow-ups<\/strong>\n- <em>Q: Row counts match but the sums are off.<\/em> A: Look for a changed type/unit (cents vs dollars), a currency join dropping rows, or dedupe removing valid rows.\n- <em>Q: What do you tell stakeholders?<\/em> A: Acknowledge, state the known scope and ETA, show a banner on the dashboard, then post a root cause and prevention after.<\/p>"}, {"q": "I2. \"Pipeline succeeded but data is wrong.\"", "a": "<p>Green job status is not data correctness. Add <strong>data tests<\/strong> (row count within tolerance, freshness, null rate, distribution drift), reconciliation to source totals, and <strong>anomaly alerts<\/strong>. Treat a silent failure as a monitoring gap and add a check for it.<\/p>"}, {"q": "I3. \"Streaming job fell behind (lag growing).\"", "a": "<ul>\n<li>Check consumer lag (Kafka lag, Kinesis <code>IteratorAge<\/code>), then <strong>input rate vs processing rate<\/strong>.<\/li>\n<li>Causes: data skew, hot partition, slow sink, state growth, GC, small micro-batches, a poison message looping.<\/li>\n<li>Fix: scale partitions/executors, fix skew (salting), bulk-write the sink, tune trigger/<code>maxOffsetsPerTrigger<\/code>, fix or DLQ the poison record.<\/li>\n<li>Follow-up: <em>Q: Can you just add consumers?<\/em> A: Only up to the partition count; beyond that, repartition the topic (note: changes key ordering).<\/li>\n<\/ul>"}, {"q": "I4. \"Duplicates in the fact table.\"", "a": "<p>Causes: at-least-once delivery, retries, a rerun without idempotency, a join fan-out. Fix: dedupe with a key and version, change writes to <code>MERGE<\/code>/upsert, and add a uniqueness test. Follow-up: <em>Q: How do you clean existing duplicates safely?<\/em> A: Back up/snapshot, dedupe in a staging table with <code>ROW_NUMBER<\/code>, validate counts, then swap.<\/p>"}, {"q": "I5. \"Someone dropped/overwrote a table.\"", "a": "<p>Delta: <code>RESTORE<\/code> / time travel. Redshift: restore from snapshot (table-level restore). Postgres: PITR (point-in-time recovery) or restore a partition. Prevention: least-privilege access, no ad-hoc writes to prod, retention settings, and tested restore drills.<\/p>"}, {"q": "I6. \"Upstream changed the schema overnight.\"", "a": "<p>Detect (schema registry / Auto Loader rescue column / failing contract test), contain (quarantine, don't corrupt silver), fix (handle new column, backfill the rescued data), prevent (data contracts and an agreed change process with the producer).<\/p>"}, {"q": "I7. \"Backfill is taking 3 days and blocks production.\"", "a": "<p>Chunk by date, run in a separate cluster/queue, parallelize safely, checkpoint progress so it's resumable, throttle, and prioritize the most recent partitions first so the business gets recent data sooner.<\/p>"}]}, {"id": "architecture-comparison", "name": "Architecture comparison", "items": [{"q": "Overview", "a": "<table>\n<thead>\n<tr>\n<th>Architecture<\/th>\n<th>Late data handling<\/th>\n<th>DQ handling<\/th>\n<th>Backfill<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Lambda (batch + speed)<\/td>\n<td>Batch layer corrects the speed layer<\/td>\n<td>Validate in both layers; reconcile<\/td>\n<td>Rerun batch for date range<\/td>\n<\/tr>\n<tr>\n<td>Kappa (stream only)<\/td>\n<td>Watermarks + late topic + replay<\/td>\n<td>DLQ at the stream<\/td>\n<td>Replay the log with a new job/checkpoint<\/td>\n<\/tr>\n<tr>\n<td>Warehouse (Redshift/Postgres)<\/td>\n<td>Lookback window + upsert + placeholder dims<\/td>\n<td>Staging + tests + error table<\/td>\n<td>Parameterized rerun + shadow table swap<\/td>\n<\/tr>\n<tr>\n<td>Medallion (Databricks/Delta)<\/td>\n<td>Bronze keeps all; silver <code>MERGE<\/code>; gold incremental<\/td>\n<td>DLT expectations + quarantine<\/td>\n<td>Time travel <code>RESTORE<\/code> + replay from bronze<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"q": "Tech stack by track", "a": "<ul>\n<li><strong>Batch + streaming<\/strong>: Kafka or Kinesis, Spark Structured Streaming, Airflow, S3, Schema Registry<\/li>\n<li><strong>Warehouse<\/strong>: S3, Redshift (<code>COPY<\/code>, Spectrum), RDS/Aurora Postgres, dbt, Airflow/MWAA<\/li>\n<li><strong>Medallion<\/strong>: Databricks, Delta Lake, Auto Loader, DLT, Unity Catalog, Workflows<\/li>\n<li><strong>AWS glue-together<\/strong>: Lambda, Kinesis/Firehose, Glue, Step Functions, DMS, CloudWatch, RDS Proxy<\/li>\n<\/ul>"}, {"q": "One-line answers to memorize", "a": "<ul>\n<li><em>Late data<\/em>: \"Use event time, watermark for streaming, lookback window for batch, upsert so reruns are safe.\"<\/li>\n<li><em>Bad data<\/em>: \"Validate early, quarantine with a reason, alert on rate, never drop silently.\"<\/li>\n<li><em>Backfill<\/em>: \"Parameterize by date, build to shadow/new checkpoint, validate, swap, keep a rollback.\"<\/li>\n<li><em>Everything<\/em>: \"Make it idempotent, replayable and observable.\"<\/li>\n<\/ul>"}]}, {"id": "tools-aws-glue-airflow", "name": "Tools: AWS, Glue, Airflow", "items": [{"q": "TA1. AWS data platform map (what each service is for)", "a": "<table>\n<thead>\n<tr>\n<th>Layer<\/th>\n<th>Service<\/th>\n<th>Role in the orders pipeline<\/th>\n<th>One-line interview point<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Storage<\/td>\n<td><strong>S3<\/strong><\/td>\n<td>Raw (bronze), curated (silver), gold zones as prefixes/buckets<\/td>\n<td>Partition by <code>event_date<\/code>; keep raw immutable so you can always replay<\/td>\n<\/tr>\n<tr>\n<td>Catalog<\/td>\n<td><strong>Glue Data Catalog<\/strong><\/td>\n<td>Table and partition metadata shared by Glue, Athena, Redshift Spectrum, EMR<\/td>\n<td>One catalog, many engines<\/td>\n<\/tr>\n<tr>\n<td>Governance<\/td>\n<td><strong>Lake Formation + IAM + KMS<\/strong><\/td>\n<td>Table/column/row permissions, encryption<\/td>\n<td>Column-level masking for PII; least-privilege roles per job<\/td>\n<\/tr>\n<tr>\n<td>Ingest (stream)<\/td>\n<td><strong>Kinesis / MSK + Firehose<\/strong><\/td>\n<td>Events to S3 and to consumers<\/td>\n<td>Firehose lands raw to S3 in micro-batches<\/td>\n<\/tr>\n<tr>\n<td>Ingest (CDC)<\/td>\n<td><strong>DMS<\/strong><\/td>\n<td>Database changes (e.g. Postgres) to S3 or Kinesis<\/td>\n<td>Full load plus ongoing CDC; handles initial snapshot<\/td>\n<\/tr>\n<tr>\n<td>Transform<\/td>\n<td><strong>Glue ETL (Spark)<\/strong><\/td>\n<td>Serverless batch/streaming Spark<\/td>\n<td>No cluster to manage; billed by DPU-time<\/td>\n<\/tr>\n<tr>\n<td>Query<\/td>\n<td><strong>Athena<\/strong><\/td>\n<td>SQL over S3 (pay per data scanned)<\/td>\n<td>Parquet plus partitions cut the bill<\/td>\n<\/tr>\n<tr>\n<td>Warehouse<\/td>\n<td><strong>Redshift<\/strong><\/td>\n<td>Gold-layer BI<\/td>\n<td><code>COPY<\/code> from S3, Spectrum for lake data<\/td>\n<\/tr>\n<tr>\n<td>Orchestration<\/td>\n<td><strong>MWAA (Airflow) / Step Functions<\/strong><\/td>\n<td>Schedule, dependencies, retries, backfills<\/td>\n<td>Airflow for data pipelines, Step Functions for service workflows<\/td>\n<\/tr>\n<tr>\n<td>Monitoring<\/td>\n<td><strong>CloudWatch + EventBridge<\/strong><\/td>\n<td>Metrics, alarms, event triggers<\/td>\n<td>Alarm on freshness and row counts, not only job failure<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Follow-ups<\/strong>\n- <em>Q: Glue, EMR, or Lambda for a transform?<\/em> A: Lambda for small, short (under 15 min) event-driven work. Glue for serverless Spark with little ops. EMR when you need cluster-level control (custom libraries, tuning, long-running or very large jobs).\n- <em>Q: How do you keep Athena cost down?<\/em> A: Columnar format (Parquet), partition pruning, compaction to avoid small files, and select only needed columns.\n- <em>Q: How is PII protected on S3?<\/em> A: KMS encryption at rest, TLS in transit, Lake Formation column/row filters, tokenize or hash sensitive fields at ingestion, CloudTrail for audit.<\/p>"}, {"q": "TA2. Glue ingestion jobs (bookmarks, pushdown, small files, quality)", "a": "<p><strong>Scenario<\/strong>: A Glue job ingests daily order files from S3 into curated Parquet. It must not reprocess old files, must handle small files, and must reject bad data.<\/p>\n<p><strong>Answer<\/strong>\n- <strong>Job bookmarks<\/strong> remember what was processed so reruns skip old files. They need <code>job.init()<\/code>, <code>job.commit()<\/code> and a unique <code>transformation_ctx<\/code> on each source.\n- <strong>Pushdown predicate<\/strong> limits which partitions are even listed and read.\n- <strong>Small files<\/strong>: group input files with <code>groupFiles<\/code> and <code>groupSize<\/code>.\n- <strong>Dynamic partition overwrite<\/strong> so a rerun replaces only the partitions it touches (idempotent).\n- <strong>Glue Data Quality<\/strong> (DQDL rules) as a gate before publishing.<\/p>\n<pre><code class=\"language-python\">import sys\nfrom awsglue.context import GlueContext\nfrom awsglue.job import Job\nfrom awsglue.utils import getResolvedOptions\nfrom pyspark.context import SparkContext\n\nargs = getResolvedOptions(sys.argv, [&quot;JOB_NAME&quot;, &quot;start_date&quot;, &quot;end_date&quot;])\nsc = SparkContext()\nglue = GlueContext(sc)\nspark = glue.spark_session\nspark.conf.set(&quot;spark.sql.sources.partitionOverwriteMode&quot;, &quot;dynamic&quot;)\njob = Job(glue); job.init(args[&quot;JOB_NAME&quot;], args)\n\ndyf = glue.create_dynamic_frame.from_catalog(\n    database=&quot;raw&quot;, table_name=&quot;orders&quot;,\n    push_down_predicate=f&quot;order_date &gt;= '{args['start_date']}' AND order_date &lt;= '{args['end_date']}'&quot;,\n    additional_options={&quot;groupFiles&quot;: &quot;inPartition&quot;, &quot;groupSize&quot;: &quot;134217728&quot;},\n    transformation_ctx=&quot;src_orders&quot;)\n\ndf = (dyf.toDF()\n      .filter(&quot;order_id IS NOT NULL AND amount &gt;= 0&quot;)\n      .dropDuplicates([&quot;order_id&quot;, &quot;updated_at&quot;]))\n\n(df.write.mode(&quot;overwrite&quot;).partitionBy(&quot;order_date&quot;)\n   .parquet(&quot;s3://lake/curated/orders/&quot;))\njob.commit()\n<\/code><\/pre>\n<p>Glue Data Quality ruleset (DQDL):<\/p>\n<pre><code>Rules = [\n  RowCount &gt; 0,\n  IsComplete &quot;order_id&quot;,\n  IsUnique &quot;order_id&quot;,\n  ColumnValues &quot;amount&quot; &gt;= 0,\n  Completeness &quot;customer_id&quot; &gt; 0.99\n]\n<\/code><\/pre>\n<p><strong>Follow-ups<\/strong>\n- <em>Q: How do you backfill with bookmarks on?<\/em> A: Bookmarks would skip files already seen. Either reset the bookmark (<code>aws glue reset-job-bookmark<\/code>), run with bookmarks disabled on an explicit date range, or pass <code>start_date<\/code>/<code>end_date<\/code> arguments and rely on partition overwrite for idempotency. The parameterized approach is the cleanest and leaves the normal bookmark state alone.\n- <em>Q: Bookmarks vs your own watermark table?<\/em> A: Bookmarks are convenient for append-only S3 files. They are weak for late updates to existing files and hard to inspect, so for updates or critical pipelines keep an explicit high-water mark or process by partition.\n- <em>Q: Crawlers or defined tables?<\/em> A: Crawlers are fine for discovery. In production define the schema explicitly, because a crawler can silently change types when the source drifts.\n- <em>Q: DynamicFrame or DataFrame?<\/em> A: DynamicFrame tolerates mixed-type columns (<code>ResolveChoice<\/code>), which helps with messy sources. Convert to DataFrame for most transformations and for writes.\n- <em>Q: The job is slow. What do you check?<\/em> A: Number and size of input files, skew in the Spark UI, worker type and count (or auto scaling), shuffle partitions, and whether pushdown is actually pruning partitions.<\/p>"}, {"q": "TA3. Airflow orchestration (idempotent DAGs, backfills, sensors)", "a": "<p><strong>Scenario<\/strong>: Orchestrate S3 arrival, Glue transform, quality gate, then load to the warehouse. It must be safe to rerun and to backfill 30 days.<\/p>\n<p><strong>Answer<\/strong>\n- Tasks use the <strong>data interval<\/strong> (<code>{{ data_interval_start }}<\/code>, <code>{{ ds }}<\/code>), not \"now\", so a run for a past date processes that date's data.\n- Every task is <strong>idempotent<\/strong>: overwrite a partition or <code>MERGE<\/code>, never blind append.\n- <code>max_active_runs=1<\/code> where runs must not overlap; <code>retries<\/code> with backoff for transient failures.\n- <strong>Sensors<\/strong> wait for files. Use <code>mode=\"reschedule\"<\/code> or deferrable operators so a waiting task doesn't hold a worker slot.\n- <strong>Quality gate<\/strong> task fails the DAG before the publish step, so bad data never reaches consumers.<\/p>\n<pre><code class=\"language-python\">from datetime import datetime, timedelta\nfrom airflow import DAG\nfrom airflow.providers.amazon.aws.sensors.s3 import S3KeySensor\nfrom airflow.providers.amazon.aws.operators.glue import GlueJobOperator\nfrom airflow.operators.python import PythonOperator\n\nwith DAG(\n    dag_id=&quot;orders_daily&quot;,\n    start_date=datetime(2026, 9, 1),\n    schedule=&quot;0 2 * * *&quot;,\n    catchup=False,\n    max_active_runs=1,\n    default_args={&quot;retries&quot;: 3, &quot;retry_delay&quot;: timedelta(minutes=5), &quot;retry_exponential_backoff&quot;: True},\n) as dag:\n\n    wait_files = S3KeySensor(\n        task_id=&quot;wait_for_files&quot;,\n        bucket_name=&quot;lake&quot;,\n        bucket_key=&quot;raw/orders/order_date={{ ds }}/_SUCCESS&quot;,\n        mode=&quot;reschedule&quot;, poke_interval=300, timeout=6 * 3600)\n\n    transform = GlueJobOperator(\n        task_id=&quot;glue_transform&quot;,\n        job_name=&quot;orders_curated&quot;,\n        script_args={&quot;--start_date&quot;: &quot;{{ ds }}&quot;, &quot;--end_date&quot;: &quot;{{ ds }}&quot;},\n        wait_for_completion=True)\n\n    def quality_gate(ds, **_):\n        # compare row counts / sums against source manifest; raise on mismatch\n        ...\n\n    check = PythonOperator(task_id=&quot;quality_gate&quot;, python_callable=quality_gate)\n\n    wait_files &gt;&gt; transform &gt;&gt; check\n<\/code><\/pre>\n<p>Backfill (Airflow 2 CLI; the command differs in Airflow 3):<\/p>\n<pre><code>airflow dags backfill -s 2026-09-01 -e 2026-09-30 --reset-dagruns orders_daily\n<\/code><\/pre>\n<p><strong>Follow-ups<\/strong>\n- <em>Q: <code>catchup=True<\/code> or <code>False<\/code>?<\/em> A: <code>False<\/code> for most pipelines so a long pause doesn't trigger hundreds of runs. Use explicit backfills when you want history. <code>True<\/code> only when every missed interval must run automatically.\n- <em>Q: What goes in XCom?<\/em> A: Small metadata only (paths, counts, run ids). Never datasets, because XCom lives in the metadata database.\n- <em>Q: A task succeeded but the data is wrong?<\/em> A: Add explicit data checks as tasks (row counts, nulls, freshness) and fail the DAG on them. A green task only means the code ran.\n- <em>Q: Process 100 tables with one DAG?<\/em> A: Dynamic task mapping (<code>.expand()<\/code>) or generate tasks from config, with <code>pool<\/code> limits so you don't overload the warehouse.\n- <em>Q: How do you trigger when upstream data lands rather than on a clock?<\/em> A: Sensors, or data-aware scheduling (Datasets/Assets) so a downstream DAG runs when an upstream task updates its output.\n- <em>Q: Airflow or Glue workflows?<\/em> A: Glue workflows are fine for a Glue-only chain. Airflow wins for cross-system pipelines (Glue, Databricks, Snowflake, Redshift), backfills, and richer retry/alerting.<\/p>"}, {"q": "TA4. End-to-end flow on AWS (what to draw on the whiteboard)", "a": "<pre><code>Sources (app DB, files, events)\n   -&gt; DMS / Firehose / Kinesis ........ ingestion\n   -&gt; S3 raw (immutable)               bronze\n   -&gt; Glue ETL (clean, dedupe, DQ)     silver, Parquet, partitioned by event_date\n   -&gt; Glue/Databricks/dbt (aggregate)  gold\n   -&gt; Redshift / Snowflake / Athena    serving\nAirflow (MWAA) orchestrates every hop; CloudWatch alarms on freshness and volume.\n<\/code><\/pre>\n<p><strong>Failure handling to mention<\/strong>\n- Ingestion fails: files stay in raw; the rerun is idempotent.\n- Transform fails: bookmark/partition overwrite means no partial data is published.\n- Quality fails: DAG stops before publish; bad rows go to a quarantine prefix with the reason.\n- Late files: lookback window in the daily job reprocesses the last N partitions.<\/p>"}]}, {"id": "tools-databricks", "name": "Tools: Databricks lakehouse", "items": [{"q": "TD1. Upserts with MERGE (batch and streaming)", "a": "<p><strong>Scenario<\/strong>: The source sends inserts, updates and deletes for orders, sometimes out of order and sometimes duplicated. Keep silver correct and the job rerunnable.<\/p>\n<pre><code class=\"language-sql\">MERGE INTO silver.orders AS t\nUSING (\n  SELECT * FROM bronze.orders_batch\n  QUALIFY ROW_NUMBER() OVER (PARTITION BY order_id ORDER BY updated_at DESC) = 1\n) AS s\nON t.order_id = s.order_id AND t.order_date &gt;= current_date() - 7   -- prune files\nWHEN MATCHED AND s.op = 'DELETE' THEN DELETE\nWHEN MATCHED AND s.updated_at &gt; t.updated_at THEN UPDATE SET *\nWHEN NOT MATCHED AND s.op &lt;&gt; 'DELETE' THEN INSERT *;\n<\/code><\/pre>\n<p>Streaming version with <code>foreachBatch<\/code>:<\/p>\n<pre><code class=\"language-python\">from delta.tables import DeltaTable\n\ndef upsert(batch_df, batch_id):\n    latest = (batch_df.withColumn(&quot;rn&quot;, F.row_number().over(\n                 Window.partitionBy(&quot;order_id&quot;).orderBy(F.col(&quot;updated_at&quot;).desc())))\n              .filter(&quot;rn = 1&quot;).drop(&quot;rn&quot;))\n    (DeltaTable.forName(spark, &quot;silver.orders&quot;).alias(&quot;t&quot;)\n        .merge(latest.alias(&quot;s&quot;), &quot;t.order_id = s.order_id&quot;)\n        .whenMatchedUpdateAll(condition=&quot;s.updated_at &gt; t.updated_at&quot;)\n        .whenNotMatchedInsertAll()\n        .execute())\n\n(spark.readStream.table(&quot;bronze.orders&quot;)\n   .writeStream.foreachBatch(upsert)\n   .option(&quot;checkpointLocation&quot;, &quot;s3://lake/chk/silver_orders&quot;)\n   .trigger(availableNow=True).start())\n<\/code><\/pre>\n<p><strong>Follow-ups<\/strong>\n- <em>Q: \"Multiple source rows matched\" error?<\/em> A: Several source rows hit one target row. Dedupe the source first (above).\n- <em>Q: Why the <code>updated_at<\/code> guard?<\/em> A: Out-of-order and replayed data must not overwrite newer rows. It also makes reruns idempotent.\n- <em>Q: MERGE is slow on a big table.<\/em> A: Add a partition or clustering predicate in <code>ON<\/code> to prune files, cluster on the merge key (liquid clustering), use deletion vectors / low-shuffle merge, and compact small files with <code>OPTIMIZE<\/code>.\n- <em>Q: Two jobs MERGE the same table and one fails?<\/em> A: <code>ConcurrentAppendException<\/code> from optimistic concurrency. Make writers touch disjoint partitions (put it in the <code>ON<\/code> clause), enable row-level concurrency, or serialize with retry.\n- <em>Q: MERGE or <code>AUTO CDC<\/code> / <code>apply_changes<\/code>?<\/em> A: For CDC feeds in a declarative pipeline, <code>apply_changes<\/code> (called <code>AUTO CDC<\/code> in newer docs) handles ordering by <code>sequence_by<\/code>, deletes and SCD1/SCD2 for you. Use hand-written MERGE when you need custom logic.<\/p>"}, {"q": "TD2. Streaming tables vs materialized views vs views", "a": "<table>\n<thead>\n<tr>\n<th><\/th>\n<th><strong>Streaming table<\/strong><\/th>\n<th><strong>Materialized view<\/strong><\/th>\n<th><strong>View<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Input<\/td>\n<td>Append-only streaming source (files, Kafka, another streaming table)<\/td>\n<td>Any SQL query, including joins and aggregations<\/td>\n<td>Any SQL query<\/td>\n<\/tr>\n<tr>\n<td>Processing<\/td>\n<td>Each new row processed once, incrementally<\/td>\n<td>Result stored; refreshed incrementally when possible, otherwise recomputed<\/td>\n<td>Recomputed on every query<\/td>\n<\/tr>\n<tr>\n<td>Storage<\/td>\n<td>Yes<\/td>\n<td>Yes<\/td>\n<td>No<\/td>\n<\/tr>\n<tr>\n<td>Handles late/corrected source data<\/td>\n<td>Only what arrives as new rows<\/td>\n<td><strong>Yes<\/strong>, refresh reflects the current source<\/td>\n<td>Yes (always current)<\/td>\n<\/tr>\n<tr>\n<td>Best for<\/td>\n<td>Bronze ingestion, silver cleaning<\/td>\n<td><strong>Gold<\/strong> aggregates and joins<\/td>\n<td>Light logic, security filters<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<pre><code class=\"language-sql\">-- BRONZE: streaming table, Auto Loader via read_files\nCREATE OR REFRESH STREAMING TABLE bronze_orders\nAS SELECT *, current_timestamp() AS _ingest_ts, _metadata.file_path AS _source_file\nFROM STREAM read_files('s3://lake/raw/orders/', format =&gt; 'json');\n\n-- SILVER: streaming table with data-quality expectations\nCREATE OR REFRESH STREAMING TABLE silver_orders (\n  CONSTRAINT valid_order_id  EXPECT (order_id IS NOT NULL) ON VIOLATION DROP ROW,\n  CONSTRAINT non_negative    EXPECT (amount &gt;= 0)          ON VIOLATION FAIL UPDATE\n)\nAS SELECT order_id, customer_id, product_id,\n          CAST(order_date AS DATE) AS order_date, quantity, amount, updated_at\nFROM STREAM(bronze_orders);\n\n-- GOLD: materialized view, incremental refresh, self-corrects when silver changes\nCREATE OR REPLACE MATERIALIZED VIEW gold_daily_revenue\nAS SELECT order_date, SUM(amount) AS revenue, COUNT(*) AS orders\nFROM silver_orders\nGROUP BY order_date;\n<\/code><\/pre>\n<p>(These run in a declarative pipeline, formerly Delta Live Tables and now called Lakeflow Spark Declarative Pipelines, or in Databricks SQL. Product names and syntax move between releases, so confirm against current docs.)<\/p>\n<p><strong>Rule of thumb<\/strong>: streaming tables where data is <strong>append-only and processed once<\/strong> (
