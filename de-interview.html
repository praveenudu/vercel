bronze, silver). Materialized views where the answer must <strong>stay correct as inputs change<\/strong> (gold).<\/p>\n<p><strong>Follow-ups<\/strong>\n- <em>Q: Why not a streaming table for gold?<\/em> A: A streaming table won't revise earlier output when a late or corrected row changes a past aggregate. A materialized view recomputes what is affected, so late data fixes the dashboard automatically.\n- <em>Q: What breaks a streaming table?<\/em> A: An upstream update or delete. A streaming read expects append-only, so it fails unless you handle changes (for example the <code>skipChangeCommits<\/code> option, or feed it from a CDC flow instead).\n- <em>Q: Is the materialized view refresh incremental?<\/em> A: Only when the query shape and source tracking allow it; otherwise it falls back to a full recompute. The pipeline event log shows which refresh technique ran, so check it for expensive views.\n- <em>Q: Streaming table or materialized view for silver?<\/em> A: Streaming table when silver is a row-by-row clean/dedupe of append-only bronze. Use a CDC flow (<code>apply_changes<\/code> / <code>AUTO CDC<\/code>) when silver must reflect updates and deletes. Use a materialized view when silver is a join or derived result.\n- <em>Q: Triggered or continuous pipeline?<\/em> A: Triggered (scheduled) is cheapest with minutes of latency. Continuous gives seconds but keeps compute running.<\/p>"}, {"q": "TD3. Where each object belongs in the medallion layers", "a": "<table>\n<thead>\n<tr>\n<th>Layer<\/th>\n<th>Purpose<\/th>\n<th>Typical object<\/th>\n<th>Write pattern<\/th>\n<th>Quality<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Bronze<\/strong><\/td>\n<td>Raw, as received, replayable<\/td>\n<td>Streaming table (Auto Loader)<\/td>\n<td>Append only; add <code>_ingest_ts<\/code>, <code>_source_file<\/code><\/td>\n<td>Minimal; capture bad data, don't reject<\/td>\n<\/tr>\n<tr>\n<td><strong>Silver<\/strong><\/td>\n<td>Clean, deduped, conformed<\/td>\n<td>Streaming table, CDC target, or <code>MERGE<\/code> into Delta<\/td>\n<td>Upsert on business key with <code>updated_at<\/code> guard<\/td>\n<td>Expectations: drop/fail/warn; quarantine bad rows<\/td>\n<\/tr>\n<tr>\n<td><strong>Gold<\/strong><\/td>\n<td>Business-ready aggregates and marts<\/td>\n<td><strong>Materialized view<\/strong> (or Delta table built by job)<\/td>\n<td>Refreshed from silver<\/td>\n<td>Reconcile totals to source<\/td>\n<\/tr>\n<tr>\n<td><strong>Serving<\/strong><\/td>\n<td>BI, apps<\/td>\n<td>Views, Databricks SQL warehouse<\/td>\n<td>Read only<\/td>\n<td>Row/column security<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Follow-ups<\/strong>\n- <em>Q: Where do you deduplicate?<\/em> A: In silver. Bronze stays raw so you can always replay.\n- <em>Q: Where do you handle PII?<\/em> A: Mask or tokenize at silver, use Unity Catalog column masks and row filters for gold and serving.\n- <em>Q: Bronze data is wrong. Do you fix bronze?<\/em> A: No. Bronze is the immutable record. Fix the logic downstream and replay from bronze.<\/p>"}, {"q": "TD4. Ingestion: Auto Loader and `COPY INTO`", "a": "<ul>\n<li><strong>Auto Loader<\/strong> (<code>cloudFiles<\/code>) incrementally discovers new files with a checkpoint. Modes: directory listing (simple) or file notification (S3 events plus SQS; better at very high file counts).<\/li>\n<li><strong>Schema handling<\/strong>: <code>cloudFiles.schemaLocation<\/code> stores inferred schema; <code>schemaEvolutionMode<\/code> = <code>addNewColumns<\/code> (default) or <code>rescue<\/code> (unexpected data goes to <code>_rescued_data<\/code>).<\/li>\n<li><strong>Batch-style<\/strong>: <code>.trigger(availableNow=True)<\/code> processes everything pending and stops, so it runs as a cheap scheduled job.<\/li>\n<li><strong><code>COPY INTO<\/code><\/strong> is idempotent for simpler, smaller file loads; Auto Loader scales better.<\/li>\n<\/ul>\n<pre><code class=\"language-python\">(spark.readStream.format(&quot;cloudFiles&quot;)\n   .option(&quot;cloudFiles.format&quot;, &quot;json&quot;)\n   .option(&quot;cloudFiles.schemaLocation&quot;, &quot;s3://lake/schemas/orders&quot;)\n   .option(&quot;cloudFiles.schemaEvolutionMode&quot;, &quot;rescue&quot;)\n   .load(&quot;s3://lake/raw/orders/&quot;)\n   .writeStream\n   .option(&quot;checkpointLocation&quot;, &quot;s3://lake/chk/bronze_orders&quot;)\n   .trigger(availableNow=True)\n   .toTable(&quot;bronze.orders&quot;))\n<\/code><\/pre>\n<p><strong>Follow-ups<\/strong>\n- <em>Q: Auto Loader vs plain Spark <code>read<\/code>?<\/em> A: Auto Loader tracks which files it has processed, scales file discovery, and handles schema evolution. A plain read rescans everything.\n- <em>Q: You need to reprocess all files?<\/em> A: Use a new checkpoint location (or reset it) and write to a new or truncated target, with the rest of the pipeline idempotent.<\/p>"}, {"q": "TD5. Table maintenance, governance and orchestration", "a": "<ul>\n<li><strong>Maintenance<\/strong>: <code>OPTIMIZE<\/code> (compaction), liquid clustering on common filter and join keys, <code>VACUUM<\/code> with retention that preserves the time-travel window you need.<\/li>\n<li><strong>Governance<\/strong>: Unity Catalog for permissions, lineage, column masks and row filters; tags for PII.<\/li>\n<li><strong>Orchestration<\/strong>: Databricks Workflows (Jobs) for Databricks-only chains; Airflow with Databricks operators for cross-platform pipelines.<\/li>\n<li><strong>Cost<\/strong>: job clusters (not all-purpose) for scheduled work, autoscaling, serverless where it fits, and <code>availableNow<\/code> instead of always-on streams when minutes of latency is fine.<\/li>\n<\/ul>\n<p><strong>Follow-up<\/strong>: <em>Q: Your pipeline cost doubled.<\/em> A: Check for a full refresh or a materialized view falling back to full recompute, small files, an all-purpose cluster running scheduled jobs, skewed joins, and an always-on stream that could be triggered.<\/p>"}]}, {"id": "tools-snowflake", "name": "Tools: Snowflake warehouse", "items": [{"q": "TS1. Ingestion: stages, file formats, `COPY INTO`, Snowpipe", "a": "<p><strong>Concepts<\/strong>\n- A <strong>stage<\/strong> is a pointer to files: <strong>internal<\/strong> (inside Snowflake) or <strong>external<\/strong> (S3/Azure/GCS). Use a <strong>storage integration<\/strong> (IAM role, no keys in SQL) for external stages.\n- A <strong>file format<\/strong> describes how to parse files (CSV, JSON, Parquet).\n- <strong><code>COPY INTO &lt;table&gt;<\/code><\/strong> bulk-loads staged files. Snowflake remembers loaded files for about 64 days, so the same file is not loaded twice.\n- <strong>Snowpipe<\/strong> loads continuously as files arrive (auto-ingest from S3 event notifications). <strong>Snowpipe Streaming<\/strong> targets low-latency row ingestion from Kafka or an SDK.<\/p>\n<pre><code class=\"language-sql\">CREATE STORAGE INTEGRATION s3_int\n  TYPE = EXTERNAL_STAGE STORAGE_PROVIDER = 'S3' ENABLED = TRUE\n  STORAGE_AWS_ROLE_ARN = 'arn:aws:iam::123456789012:role/snowflake-read'\n  STORAGE_ALLOWED_LOCATIONS = ('s3://lake/raw/orders/');\n\nCREATE FILE FORMAT ff_parquet TYPE = PARQUET;\n\nCREATE STAGE raw.orders_stage\n  URL = 's3://lake/raw/orders/'\n  STORAGE_INTEGRATION = s3_int\n  FILE_FORMAT = ff_parquet;\n\n-- Dry run: find bad rows without loading\nCOPY INTO raw.orders FROM @raw.orders_stage\n  MATCH_BY_COLUMN_NAME = CASE_INSENSITIVE VALIDATION_MODE = RETURN_ERRORS;\n\n-- Real load\nCOPY INTO raw.orders FROM @raw.orders_stage\n  MATCH_BY_COLUMN_NAME = CASE_INSENSITIVE ON_ERROR = 'SKIP_FILE';\n\n-- Continuous load\nCREATE PIPE raw.orders_pipe AUTO_INGEST = TRUE AS\n  COPY INTO raw.orders FROM @raw.orders_stage\n  MATCH_BY_COLUMN_NAME = CASE_INSENSITIVE;\n<\/code><\/pre>\n<p><strong>Follow-ups<\/strong>\n- <em>Q: A load partially failed. What happens?<\/em> A: Depends on <code>ON_ERROR<\/code>: <code>ABORT_STATEMENT<\/code> (default for <code>COPY<\/code>), <code>SKIP_FILE<\/code>, or <code>CONTINUE<\/code>. Check <code>COPY_HISTORY<\/code> / <code>LOAD_HISTORY<\/code> for per-file status and rejected rows, and keep rejected data for repair.\n- <em>Q: How do you reload a file on purpose?<\/em> A: <code>FORCE = TRUE<\/code> ignores load history and <strong>creates duplicates<\/strong> unless the target is deduped or you clear the data first. State that risk.\n- <em>Q: <code>COPY INTO<\/code> or Snowpipe?<\/em> A: <code>COPY INTO<\/code> for scheduled batch loads you control. Snowpipe for continuous arrival with minutes of latency and serverless compute.\n- <em>Q: A Snowpipe is not loading files.<\/em> A: Check pipe status (<code>SYSTEM$PIPE_STATUS<\/code>), the S3 event notification to the pipe's SQS queue, stage path and permissions, and file format errors in copy history.\n- <em>Q: Semi-structured JSON?<\/em> A: Land it as <code>VARIANT<\/code>, then flatten and cast into typed columns in silver. Typed columns prune and join better.<\/p>"}, {"q": "TS2. Streams and tasks (change capture and scheduled processing)", "a": "<p><strong>Concepts<\/strong>\n- A <strong>stream<\/strong> records changes (inserts, updates, deletes) on a table since it was last consumed. It exposes <code>METADATA$ACTION<\/code>, <code>METADATA$ISUPDATE<\/code> and <code>METADATA$ROW_ID<\/code>. An update appears as a delete plus an insert with <code>ISUPDATE = TRUE<\/code>.\n- A stream's position advances only when <strong>consumed by DML in a committed transaction<\/strong>. A plain <code>SELECT<\/code> does not advance it.\n- A <strong>task<\/strong> runs SQL on a schedule or after another task. <code>WHEN SYSTEM$STREAM_HAS_DATA('stream')<\/code> skips runs when there is nothing new, which saves credits.\n- Tasks are created <strong>suspended<\/strong>; you must <code>RESUME<\/code> them. Task graphs use <code>AFTER<\/code>.<\/p>\n<pre><code class=\"language-sql\">CREATE STREAM raw.orders_stream ON TABLE raw.orders;   -- append_only = true also available\n\nCREATE TASK silver.merge_orders\n  WAREHOUSE = etl_wh\n  SCHEDULE = '5 MINUTE'\n  WHEN SYSTEM$STREAM_HAS_DATA('raw.orders_stream')\nAS\nMERGE INTO silver.orders t\nUSING (\n  SELECT * FROM raw.orders_stream\n  WHERE METADATA$ACTION = 'INSERT'\n  QUALIFY ROW_NUMBER() OVER (PARTITION BY order_id ORDER BY updated_at DESC) = 1\n) s\nON t.order_id = s.order_id\nWHEN MATCHED AND s.updated_at &gt; t.updated_at THEN UPDATE SET\n  t.amount = s.amount, t.status = s.status, t.updated_at = s.updated_at\nWHEN NOT MATCHED THEN INSERT (order_id, customer_id, amount, status, updated_at)\n  VALUES (s.order_id, s.customer_id, s.amount, s.status, s.updated_at);\n\nALTER TASK silver.merge_orders RESUME;\n\n-- A downstream task in the same graph\nCREATE TASK gold.refresh_daily_revenue\n  WAREHOUSE = etl_wh\n  AFTER silver.merge_orders\nAS\n  INSERT OVERWRITE INTO gold.daily_revenue\n  SELECT order_date, SUM(amount) FROM silver.orders GROUP BY order_date;\n<\/code><\/pre>\n<p><strong>Follow-ups<\/strong>\n- <em>Q: What is a stale stream?<\/em> A: If a stream isn't consumed within the source table's data retention (extended up to a limit), its offset is lost and it becomes unusable. Consume regularly and alert on stream age.\n- <em>Q: Why dedupe inside the merge source?<\/em> A: A stream batch can hold several versions of one key, and <code>MERGE<\/code> errors (or behaves nondeterministically) with multiple matching source rows.\n- <em>Q: Standard vs append-only streams?<\/em> A: Standard captures inserts, updates and deletes. Append-only captures inserts only, which is cheaper for pure event logs.\n- <em>Q: Serverless or warehouse tasks?<\/em> A: Serverless tasks scale compute automatically with no idle warehouse. A named warehouse gives you control and shared capacity. Both need monitoring through task history.\n- <em>Q: Task failed halfway through the graph?<\/em> A: Check <code>TASK_HISTORY<\/code>; fix and rerun. Because the stream only advances on commit, a failed <code>MERGE<\/code> leaves changes unconsumed, so the next run picks them up (idempotent by design).\n- <em>Q: Streams and tasks or dynamic tables?<\/em> A: See TS3.<\/p>"}, {"q": "TS3. Dynamic tables and materialized views (incremental transformation)", "a": "<ul>\n<li><strong>Dynamic table<\/strong>: you declare the query and a <code>TARGET_LAG<\/code>; Snowflake keeps it refreshed, incrementally when it can. It replaces many stream-and-task pairs for declarative pipelines.<\/li>\n<li><strong>Materialized view<\/strong>: precomputed result of a <strong>single-table<\/strong> query, maintained automatically. Good for repeated aggregates on one table; limited functions, no joins.<\/li>\n<\/ul>\n<pre><code class=\"language-sql\">CREATE OR REPLACE DYNAMIC TABLE gold.daily_revenue\n  TARGET_LAG = '15 minutes'\n  WAREHOUSE = etl_wh\nAS\nSELECT order_date, region, SUM(amount) AS revenue, COUNT(*) AS orders\nFROM silver.orders\nGROUP BY order_date, region;\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n<th>Need<\/th>\n<th>Use<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Declarative pipeline with a freshness target<\/td>\n<td>Dynamic table<\/td>\n<\/tr>\n<tr>\n<td>Custom logic (conditional deletes, side effects, calling procedures)<\/td>\n<td>Streams + tasks<\/td>\n<\/tr>\n<tr>\n<td>Fast repeated aggregate on one table<\/td>\n<td>Materialized view<\/td>\n<\/tr>\n<tr>\n<td>Load files continuously<\/td>\n<td>Snowpipe<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Follow-ups<\/strong>\n- <em>Q: Late-arriving data in a dynamic table?<\/em> A: It refreshes from the current source, so a corrected or late silver row updates the affected aggregates on the next refresh. That makes dynamic tables (like Databricks materialized views) a good fit for gold.\n- <em>Q: What controls cost?<\/em> A: <code>TARGET_LAG<\/code> (shorter lag means more refreshes), refresh mode (incremental vs full), and the warehouse size. Check refresh history for fallbacks to full refresh.<\/p>"}, {"q": "TS4. Data warehouse concepts to know cold", "a": "<ul>\n<li><strong>Storage and compute separate<\/strong>: data lives in micro-partitions on cloud storage; <strong>virtual warehouses<\/strong> are independent compute. Scale up for heavy queries, scale out (multi-cluster) for concurrency, separate warehouses for ETL, BI and ad hoc.<\/li>\n<li><strong>Pruning<\/strong>: micro-partition min/max metadata lets queries skip data. A <strong>clustering key<\/strong> helps on large tables filtered by the same columns.<\/li>\n<li><strong>Dimensional model<\/strong>: star schema with a <strong>fact table at a stated grain<\/strong> (one row per order line) and <strong>dimensions<\/strong> with surrogate keys. SCD Type 2 keeps history with <code>valid_from<\/code>, <code>valid_to<\/code>, <code>is_current<\/code>.<\/li>\n<li><strong>Recovery<\/strong>: <strong>Time Travel<\/strong> (query or restore past data within retention), <strong>zero-copy clone<\/strong> (instant test or backup copy), <code>UNDROP<\/code>, <strong>Fail-safe<\/strong> (Snowflake-managed recovery window, not user-accessible).<\/li>\n<li><strong>Sharing and security<\/strong>: role-based access, dynamic data masking, row access policies, secure data sharing without copying.<\/li>\n<\/ul>\n<pre><code class=\"language-sql\">-- Backfill safely: clone, fix, validate, swap\nCREATE TABLE silver.orders_fix CLONE silver.orders;\n-- ... apply corrected logic to silver.orders_fix and compare totals ...\nALTER TABLE silver.orders SWAP WITH silver.orders_fix;\n\n-- Recover from a bad write\nCREATE TABLE silver.orders_restored CLONE silver.orders AT (OFFSET =&gt; -3600);\n<\/code><\/pre>\n<p><strong>Follow-ups<\/strong>\n- <em>Q: How do you handle a late-arriving dimension?<\/em> A: Insert an inferred placeholder row (<code>is_inferred = true<\/code>) so facts load, then update it when the real row arrives. For SCD2, restate the validity ranges.\n- <em>Q: Backfill without risking production?<\/em> A: Clone, rebuild on the clone, reconcile counts and sums, then <code>SWAP<\/code>. Keep the old table briefly as a rollback.\n- <em>Q: Why can Time Travel not save you forever?<\/em> A: Retention is limited (1 day by default, up to 90 on higher editions), and Fail-safe is for Snowflake-assisted recovery only. For long-term history keep snapshots or raw files.<\/p>"}]}, {"id": "tools-cheat-sheet", "name": "Tools: cheat sheet", "items": [{"q": "TC1. Which tool solves which problem", "a": "<table>\n<thead>\n<tr>\n<th>Problem<\/th>\n<th>AWS (Glue / Airflow)<\/th>\n<th>Databricks<\/th>\n<th>Snowflake<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Ingest files<\/strong><\/td>\n<td>Glue + bookmarks; Firehose to S3<\/td>\n<td>Auto Loader into a streaming table<\/td>\n<td>Stage + <code>COPY INTO<\/code>, Snowpipe<\/td>\n<\/tr>\n<tr>\n<td><strong>Ingest stream<\/strong><\/td>\n<td>Kinesis/MSK + Lambda or Glue streaming<\/td>\n<td>Structured Streaming / streaming table<\/td>\n<td>Snowpipe Streaming, Kafka connector<\/td>\n<\/tr>\n<tr>\n<td><strong>Upsert / dedupe<\/strong><\/td>\n<td>Dedupe in Spark; load to warehouse with staging + merge<\/td>\n<td><code>MERGE INTO<\/code>, <code>apply_changes<\/code> / <code>AUTO CDC<\/code><\/td>\n<td>Stream + task + <code>MERGE<\/code><\/td>\n<\/tr>\n<tr>\n<td><strong>Late data<\/strong><\/td>\n<td>Lookback window, partition overwrite<\/td>\n<td>Silver <code>MERGE<\/code> with <code>updated_at<\/code> guard; gold materialized view self-corrects<\/td>\n<td>Dynamic table refresh; merge with timestamp guard<\/td>\n<\/tr>\n<tr>\n<td><strong>Data quality<\/strong><\/td>\n<td>Glue Data Quality (DQDL), Airflow check tasks<\/td>\n<td>Expectations (<code>EXPECT ... ON VIOLATION<\/code>), quarantine table<\/td>\n<td><code>VALIDATION_MODE<\/code>, <code>ON_ERROR<\/code>, tests (dbt) before publish<\/td>\n<\/tr>\n<tr>\n<td><strong>Backfill<\/strong><\/td>\n<td>Parameterized run + Airflow backfill, bookmark reset<\/td>\n<td>Replay from bronze, <code>RESTORE<\/code>, <code>replaceWhere<\/code><\/td>\n<td>Clone + rebuild + <code>SWAP<\/code>, Time Travel<\/td>\n<\/tr>\n<tr>\n<td><strong>Orchestration<\/strong><\/td>\n<td>Airflow (MWAA), Step Functions<\/td>\n<td>Workflows, or Airflow operators<\/td>\n<td>Tasks and task graphs, or Airflow<\/td>\n<\/tr>\n<tr>\n<td><strong>Incremental serving layer<\/strong><\/td>\n<td>Redshift staging merge<\/td>\n<td><strong>Materialized views / streaming tables<\/strong><\/td>\n<td><strong>Dynamic tables<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"q": "TC2. Skills to claim, and how to prove each one", "a": "<table>\n<thead>\n<tr>\n<th>Skill<\/th>\n<th>Say it like this<\/th>\n<th>Prove it with<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Idempotent pipelines<\/td>\n<td>\"Every load is a partition overwrite or a keyed <code>MERGE<\/code>, so reruns are safe.\"<\/td>\n<td>A rerun or backfill you did without duplicates<\/td>\n<\/tr>\n<tr>\n<td>Late data<\/td>\n<td>\"Event-time logic, watermark or lookback window, and a gold layer that recomputes.\"<\/td>\n<td>Lateness window you chose and why<\/td>\n<\/tr>\n<tr>\n<td>Data quality<\/td>\n<td>\"Validate early, quarantine with a reason, alert on rate.\"<\/td>\n<td>A reject rate you tracked, an incident it caught<\/td>\n<\/tr>\n<tr>\n<td>Backfill and recovery<\/td>\n<td>\"Parameterized by date, built on a shadow copy, validated, then swapped.\"<\/td>\n<td>Rows or days restated, and how you verified<\/td>\n<\/tr>\n<tr>\n<td>Streaming<\/td>\n<td>\"At-least-once delivery plus an idempotent sink gives effectively-once.\"<\/td>\n<td>Throughput, lag, and a lag incident you fixed<\/td>\n<\/tr>\n<tr>\n<td>Cost and performance<\/td>\n<td>\"Right-size compute, fix skew and small files, prefer incremental over full.\"<\/td>\n<td>Before/after cost or runtime numbers<\/td>\n<\/tr>\n<tr>\n<td>Governance and PII<\/td>\n<td>\"Tokenize at ingestion, mask by role, audit access.\"<\/td>\n<td>The control you implemented and the data it covered<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"q": "TC3. Phrases that land in an interview", "a": "<ul>\n<li>\"Bronze is immutable, so any bug downstream is fixable by replay.\"<\/li>\n<li>\"Streaming tables for append-only ingestion, materialized views where the answer must stay correct as inputs change.\"<\/li>\n<li>\"A stream only advances on a committed consume, so a failed merge simply retries the same changes.\"<\/li>\n<li>\"A green job is not correct data, so I add data checks as pipeline steps.\"<\/li>\n<li>\"I choose the tool by the guarantee I need: ordering, latency, replay, or cost.\"<\/li>\n<\/ul>"}]}, {"id": "practice", "name": "Practice", "items": [{"q": "Mock interview prompt", "a": "<pre><code>Act as a senior data engineering interviewer for a Senior Data Engineer / AI Engineer role.\nTopics: Spark performance &amp; configs, Delta Lake, Delta Live Tables, Snowflake performance, SQL, LLM/RAG pipelines.\nDataset: ecommerce orders (order_id, customer_id, product_id, order_date, quantity, amount, status, updated_at), 2B rows.\nRules:\n1. Ask ONE scenario question at a time; start easy, increase difficulty based on my answers.\n2. Wait for my answer. Then score it 1-5 on correctness, depth, trade-offs, and communication.\n3. Show the ideal answer (with code/config), what I missed, and ONE follow-up question.\n4. After 8 questions give a summary of strengths, gaps, and a 1-week study plan.\nStart with: &quot;Choose a topic: Spark, Delta, DLT, Snowflake, SQL, or AI — or say 'mixed'.&quot;\n<\/code><\/pre>"}, {"q": "Answers worth memorising", "a": "<ul>\n<li><strong>Skew:<\/strong> \"Find the hot key in the Spark UI, enable AQE skew join, otherwise isolate hot keys or salt; NULL keys are the usual culprit.\"<\/li>\n<li><strong>Broadcast:<\/strong> \"Broadcast only the small side that fits comfortably in executor memory; never a table that could grow.\"<\/li>\n<li><strong>Delta dedupe:<\/strong> \"Dedupe the batch with ROW_NUMBER, MERGE on business key with an updated_at guard, so it's idempotent.\"<\/li>\n<li><strong>Snowflake:<\/strong> \"Clustering for pruning on range filters, MV for repeated aggregates, Search Optimization for point lookups, cache for repeated identical queries, bigger warehouse for spill.\"<\/li>\n<li><strong>DLT:<\/strong> \"Declarative pipeline; expectations for quality; APPLY CHANGES with sequence_by for CDC; streaming tables for ingestion, materialized views for gold.\"<\/li>\n<\/ul>\n<p><em>Caveat: config defaults and feature names (Liquid Clustering, Lakeflow, deletion vectors, Cortex) change with releases — confirm against current Databricks/Snowflake docs before an interview.<\/em><\/p>"}]}]};
const COLORS = {spark:'--c-spark','delta-lake':'--c-delta','delta-live-tables':'--c-dlt','snowflake-performance':'--c-snow','sql-on-the-order-table':'--c-sql','ai-engineering':'--c-ai','architecture-and-incidents':'--c-arch','practice':'--c-practice','answer-framework':'--c-answer-framework','track-a-batch-streaming':'--c-track-a-batch-streaming','track-b-warehouse':'--c-track-b-warehouse','track-c-medallion':'--c-track-c-medallion','aws-track':'--c-aws-track','incident-scenarios':'--c-incident-scenarios','architecture-comparison':'--c-architecture-comparison','tools-aws-glue-airflow':'--c-tools-aws-glue-airflow','tools-databricks':'--c-tools-databricks','tools-snowflake':'--c-tools-snowflake','tools-cheat-sheet':'--c-tools-cheat-sheet'};
const cats = DATA.cats;
const col = c => `var(${COLORS[c.id]||'--c-practice'})`;
let done = {};
try { done = JSON.parse(localStorage.getItem('de-done')||'{}'); } catch(e){}
const save = () => { try { localStorage.setItem('de-done', JSON.stringify(done)); } catch(e){} };
const key = (c,i) => c.id+':'+i;
const plain = h => { const d=document.createElement('div'); d.innerHTML=h; return d.textContent.toLowerCase(); };
cats.forEach(c => c.items.forEach(i => i.text = (i.q+' '+plain(i.a)).toLowerCase()));
const total = cats.reduce((n,c)=>n+c.items.length,0);
const $ = s => document.querySelector(s);
let view = 'home', term = '';

function nav(){
  $('#nav').innerHTML = `<li><button data-v="home" ${view==='home'&&!term?'aria-current="true"':''}><span class="dot" style="--col:#9fb3c8"></span>All categories<span class="n">${total}</span></button></li>` +
   cats.map(c=>`<li><button data-v="${c.id}" ${view===c.id&&!term?'aria-current="true"':''}><span class="dot" style="--col:${col(c)}"></span>${c.name}<span class="n">${c.items.length}</span></button></li>`).join('');
  const n = Object.values(done).filter(Boolean).length;
  $('#ptxt').textContent = `${n} of ${total} reviewed`;
  $('#pbar').style.width = (n/total*100)+'%';
}
function card(c,i,idx,open){
  const k = key(c,idx);
  return `<details class="q" style="--col:${col(c)}" ${open?'open':''}><summary><span class="qt">${i.q}${term?`<span class="crumb">${c.name}</span>`:''}</span><label class="done" onclick="event.stopPropagation()"><input type="checkbox" data-k="${k}" ${done[k]?'checked':''}> Reviewed</label></summary><div class="body">${i.a}</div></details>`;
}
function render(){
  const m = $('#main');
  if(term){
    const hits=[]; cats.forEach(c=>c.items.forEach((i,idx)=>{ if(term.split(/\s+/).every(w=>i.text.includes(w))) hits.push(card(c,i,idx,false)); }));
    m.innerHTML = `<h1>Search results</h1><p class="lede">${hits.length} match${hits.length===1?'':'es'} for “${term.replace(/</g,'&lt;')}”</p>` + (hits.join('')||'<p class="empty">No questions match. Try a shorter term such as “skew” or “merge”.</p>');
  } else if(view==='home'){
    m.innerHTML = `<h1>Data engineering interview bank</h1><p class="lede">Scenario questions with worked answers for Spark, Delta Lake, Delta Live Tables, Snowflake, SQL, AI engineering, plus architecture tracks (late data, data quality, backfill), AWS and incident scenarios, and a tools and skills section covering AWS Glue and Airflow, Databricks and Snowflake. Every answer uses the same orders data, so patterns carry across topics.</p>
    <div class="tiles">${cats.map(c=>`<button class="tile" style="--col:${col(c)}" data-v="${c.id}"><h3>${c.name}</h3><p>${c.items.length} ${c.items.length===1?'topic':'questions'}: ${c.items.slice(0,2).map(i=>i.q.replace(/^[A-Z]+\d+\.\s*/,'')).join(', ')}</p></button>`).join('')}</div>
    <div class="model">${DATA.intro}</div>`;
  } else {
    const c = cats.find(x=>x.id===view);
    m.innerHTML = `<h1>${c.name}</h1><p class="lede">${c.items.length} ${c.items.length===1?'topic':'questions'}. Open one, answer it out loud first, then check the answer.</p>
    <div class="tools"><button class="btn" id="ex">Expand all</button><button class="btn" id="co">Collapse all</button></div>` + c.items.map((i,idx)=>card(c,i,idx,false)).join('');
    $('#ex').onclick=()=>m.querySelectorAll('details').forEach(d=>d.open=true);
    $('#co').onclick=()=>m.querySelectorAll('details').forEach(d=>d.open=false);
  }
  m.querySelectorAll('pre').forEach(p=>{ const b=document.createElement('button'); b.className='copy'; b.textContent='Copy'; b.onclick=()=>{ navigator.clipboard.writeText(p.innerText.replace(/Copy$/,'').trim()).then(()=>{b.textContent='Copied';setTimeout(()=>b.textContent='Copy',1500)}).catch(()=>{b.textContent='Select and copy'}); }; p.appendChild(b); });
  nav();
}
document.addEventListener('click',e=>{
  const v = e.target.closest('[data-v]'); if(v){ view=v.dataset.v; term=''; $('#s').value=''; history.replaceState(null,'','#'+view); render(); window.scrollTo(0,0); }
});
document.addEventListener('change',e=>{ const k=e.target.dataset&&e.target.dataset.k; if(k){ done[k]=e.target.checked; save(); nav(); } });
$('#s').addEventListener('input',e=>{ term=e.target.value.trim().toLowerCase(); render(); });
const h = location.hash.slice(1); if(cats.some(c=>c.id===h)) view=h;
render();
</script>
