od rows go on, bad rows go to a <strong>dead-letter queue (DLQ)<\/strong> with the error reason and the raw payload.\n- Alert on the <strong>DLQ rate<\/strong>, not on each bad record.\n- Keep the raw payload so rows can be fixed and replayed.<\/p>\n<pre><code class=\"language-python\">valid = orders.filter(&quot;order_id IS NOT NULL AND amount &gt;= 0&quot;)\nbad = (orders.filter(&quot;order_id IS NULL OR amount &lt; 0&quot;)\n    .withColumn(&quot;dq_reason&quot;, F.when(F.col(&quot;order_id&quot;).isNull(), &quot;null_order_id&quot;)\n                              .otherwise(&quot;negative_amount&quot;)))\nbad.writeStream.format(&quot;delta&quot;).option(&quot;checkpointLocation&quot;,&quot;s3://lake/chk/dlq&quot;) \\\n   .start(&quot;s3://lake/dlq/orders&quot;)\n<\/code><\/pre>\n<p><strong>Follow-ups<\/strong>\n- <em>Q: Why not just drop bad rows?<\/em> A: Silent loss. You can't reconcile counts with the source, and the producer never learns about it.\n- <em>Q: What threshold stops the pipeline?<\/em> A: Hard stop if DLQ rate is above a threshold (e.g. 5%) because that signals an upstream break, not noisy data. Below it, continue and alert.\n- <em>Q: Schema changed upstream. What happens?<\/em> A: Use a schema registry with compatibility rules. Additive columns are fine; breaking changes are rejected at the producer.<\/p>"}, {"q": "Warehouse: data quality exceptions (staging and tests)", "a": "<p><strong>Scenario<\/strong>: Duplicate orders and orphaned foreign keys in the nightly load.<\/p>\n<p><strong>Answer<\/strong>\n- Load to <strong>staging<\/strong> first; run checks there: uniqueness, not null, referential integrity, row count vs source manifest, amount sanity ranges.\n- Failures: write offending rows to an <strong>error table<\/strong> (<code>err_orders<\/code> with reason and batch id); only clean rows move to the fact.\n- Use dbt tests (<code>unique<\/code>, <code>not_null<\/code>, <code>relationships<\/code>) and store failures; add a freshness check on source.\n- Dedupe with a window function:<\/p>\n<pre><code class=\"language-sql\">SELECT * FROM (\n  SELECT *, ROW_NUMBER() OVER (PARTITION BY order_id ORDER BY updated_at DESC) rn\n  FROM stg_orders) WHERE rn = 1;\n<\/code><\/pre>\n<p><strong>Follow-ups<\/strong>\n- <em>Q: Redshift doesn't enforce primary keys. How do you guarantee uniqueness?<\/em> A: It's informational only. Enforce through the dedupe step and tests, not constraints.\n- <em>Q: Block the load or load and flag?<\/em> A: Block on critical checks (row count, key uniqueness on facts); load and flag on soft checks (a few unknown categories).<\/p>"}, {"q": "Lakehouse (Delta): data quality exceptions (expectations, quarantine)", "a": "<p><strong>Scenario<\/strong>: Enforce quality between bronze and silver without losing bad rows.<\/p>\n<p><strong>Answer: DLT expectations<\/strong><\/p>\n<pre><code class=\"language-python\">import dlt\n\n@dlt.table\n@dlt.expect_or_drop(&quot;valid_order_id&quot;, &quot;order_id IS NOT NULL&quot;)\n@dlt.expect_or_fail(&quot;non_negative_amount&quot;, &quot;amount &gt;= 0&quot;)\n@dlt.expect(&quot;known_region&quot;, &quot;region IN ('US','EU','APAC')&quot;)   # warn only, keeps row\ndef silver_orders():\n    return dlt.read_stream(&quot;bronze_orders&quot;)\n<\/code><\/pre>\n<ul>\n<li><code>expect<\/code> = record metric, keep row; <code>expect_or_drop<\/code> = drop row; <code>expect_or_fail<\/code> = fail the update.<\/li>\n<li>Dropped rows are recorded in the DLT event log; also route them to a <strong>quarantine table<\/strong> explicitly so they can be repaired.<\/li>\n<li>Delta <strong>CHECK constraints<\/strong> (<code>ALTER TABLE ... ADD CONSTRAINT<\/code>) enforce hard rules on write.<\/li>\n<\/ul>\n<p><strong>Follow-ups<\/strong>\n- <em>Q: Which expectation for which rule?<\/em> A: Fail for rules that mean upstream is broken, drop for bad individual rows, warn for soft issues you want to trend.\n- <em>Q: How do you see quality over time?<\/em> A: Query the DLT event log for expectation pass/fail counts and put them on a dashboard and alert.\n- <em>Q: Schema drift?<\/em> A: Auto Loader <code>schemaEvolutionMode = rescue<\/code> puts unexpected fields into <code>_rescued_data<\/code> instead of failing or silently dropping.<\/p>"}, {"q": "Pipeline succeeded but the data is wrong", "a": "<p>Green job status is not data correctness. Add <strong>data tests<\/strong> (row count within tolerance, freshness, null rate, distribution drift), reconciliation to source totals, and <strong>anomaly alerts<\/strong>. Treat a silent failure as a monitoring gap and add a check for it.<\/p>", "tag": "Classic"}, {"q": "Duplicates in the fact table", "a": "<p>Causes: at-least-once delivery, retries, a rerun without idempotency, a join fan-out. Fix: dedupe with a key and version, change writes to <code>MERGE<\/code>/upsert, and add a uniqueness test. Follow-up: <em>Q: How do you clean existing duplicates safely?<\/em> A: Back up/snapshot, dedupe in a staging table with <code>ROW_NUMBER<\/code>, validate counts, then swap.<\/p>", "tag": "Classic"}, {"q": "Data quality ownership", "a": "<p>Contracts at the source, expectations at silver, reconciliation counts bronze→silver→gold, anomaly alerts on volume/null-rate.<\/p>", "tag": "Classic"}, {"q": "Reconcile source versus target", "a": "<p><strong>Scenario<\/strong>: Finance says the warehouse revenue differs from the source system.<\/p>\n<p><strong>Approach, narrowing down<\/strong>\n1. <strong>Totals<\/strong> by day: row count and sum of amount, source versus target.\n2. For the days that differ, compare <strong>by key set<\/strong>: which keys are missing, extra, or have different values (anti-joins).\n3. Classify the cause, then fix the pipeline, not just the numbers.<\/p>\n<pre><code class=\"language-sql\">WITH s AS (SELECT order_date, COUNT(*) n, SUM(amount) amt FROM source.orders GROUP BY 1),\n     t AS (SELECT order_date, COUNT(*) n, SUM(amount) amt FROM gold.orders   GROUP BY 1)\nSELECT COALESCE(s.order_date, t.order_date) AS order_date,\n       s.n AS src_rows, t.n AS tgt_rows, s.amt AS src_amt, t.amt AS tgt_amt\nFROM s FULL OUTER JOIN t ON s.order_date = t.order_date\nWHERE COALESCE(s.n, -1) &lt;&gt; COALESCE(t.n, -1)\n   OR ROUND(COALESCE(s.amt, 0), 2) &lt;&gt; ROUND(COALESCE(t.amt, 0), 2);\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n<th>Typical cause<\/th>\n<th>Sign<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Late data not yet loaded<\/td>\n<td>Difference shrinks over time<\/td>\n<\/tr>\n<tr>\n<td>Time zone or cutoff differences<\/td>\n<td>Rows shift between adjacent days<\/td>\n<\/tr>\n<tr>\n<td>Deletes not propagated<\/td>\n<td>Target has extra rows<\/td>\n<\/tr>\n<tr>\n<td>Dedupe rule too aggressive<\/td>\n<td>Target has fewer rows than source<\/td>\n<\/tr>\n<tr>\n<td>Rounding or currency conversion<\/td>\n<td>Row counts match, sums differ by small amounts<\/td>\n<\/tr>\n<tr>\n<td>Source still changing<\/td>\n<td>Compare against a snapshot at a fixed \"as of\" time<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Follow-ups<\/strong>\n- <em>Q: How do you do this at scale?<\/em> A: Compare per-partition <strong>checksums<\/strong> (hash of keys and values) first, then drill only into partitions that differ.\n- <em>Q: How do you make it routine?<\/em> A: A scheduled reconciliation job that writes results to a table, with alerts on tolerance breaches.<\/p>", "tag": "Hard"}], "id": "sc-data-quality"}, {"name": "Troubleshooting & incidents", "group": "Scenarios by type", "items": [{"q": "Pipeline failed at 3 AM; dashboard shows yesterday's revenue", "a": "<p>Triage: blast radius → rerun idempotently (MERGE/overwrite partition, not append) → root cause → add alert + data freshness SLA + runbook.<\/p>", "tag": "Classic"}, {"q": "Dashboard shows revenue down 40%", "a": "<p><strong>Triage in order<\/strong>\n1. Is it real? Compare with the source system and with the previous days' pattern.\n2. Freshness: did the latest partition/batch land? Check scheduler status and the source's last-modified time.\n3. Volume: row counts per stage (bronze, silver, gold) to find where rows vanish.\n4. Recent change: deployment, schema change, config, upstream release.\n5. Late data: is it simply not arrived yet (check the event time vs arrival time)?<\/p>\n<p><strong>Follow-ups<\/strong>\n- <em>Q: Row counts match but the sums are off.<\/em> A: Look for a changed type/unit (cents vs dollars), a currency join dropping rows, or dedupe removing valid rows.\n- <em>Q: What do you tell stakeholders?<\/em> A: Acknowledge, state the known scope and ETA, show a banner on the dashboard, then post a root cause and prevention after.<\/p>", "tag": "Classic"}, {"q": "Streaming job fell behind (lag growing)", "a": "<ul>\n<li>Check consumer lag (Kafka lag, Kinesis <code>IteratorAge<\/code>), then <strong>input rate vs processing rate<\/strong>.<\/li>\n<li>Causes: data skew, hot partition, slow sink, state growth, GC, small micro-batches, a poison message looping.<\/li>\n<li>Fix: scale partitions/executors, fix skew (salting), bulk-write the sink, tune trigger/<code>maxOffsetsPerTrigger<\/code>, fix or DLQ the poison record.<\/li>\n<li>Follow-up: <em>Q: Can you just add consumers?<\/em> A: Only up to the partition count; beyond that, repartition the topic (note: changes key ordering).<\/li>\n<\/ul>", "tag": "Hard"}, {"q": "Cost doubled this month", "a": "<p>Query history top spenders, warehouse/cluster idle time, small-files, full refreshes, unbounded <code>SELECT *<\/code>, missing auto-suspend; fix with monitors + tagging by team.<\/p>", "tag": "Classic"}, {"q": "A job or query is slow: triage by stack", "a": "<p><strong>First, always<\/strong>: compare with the last good run. What changed: data volume, query plan, configuration, concurrency?<\/p>\n<table>\n<thead>\n<tr>\n<th>Stack<\/th>\n<th>Look at<\/th>\n<th>Usual causes<\/th>\n<th>Fix<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Spark / Databricks<\/strong><\/td>\n<td>Spark UI: task time max versus median, spill, shuffle size<\/td>\n<td>Skew, too few or too many shuffle partitions, small files, missing broadcast<\/td>\n<td>AQE, salting, repartition, broadcast, <code>OPTIMIZE<\/code><\/td>\n<\/tr>\n<tr>\n<td><strong>Snowflake<\/strong><\/td>\n<td>Query Profile: partitions scanned versus total, spill, exploding joins, queuing<\/td>\n<td>Poor pruning, undersized warehouse, wrong join keys<\/td>\n<td>Clustering, bigger warehouse, fix joins, multi-cluster for concurrency<\/td>\n<\/tr>\n<tr>\n<td><strong>Redshift<\/strong><\/td>\n<td><code>EXPLAIN<\/code>, system views, WLM queue wait<\/td>\n<td>Stale stats, unsorted data, distribution skew, queue contention<\/td>\n<td><code>ANALYZE<\/code>, <code>VACUUM<\/code>, better dist and sort keys, WLM tuning<\/td>\n<\/tr>\n<tr>\n<td><strong>Postgres<\/strong><\/td>\n<td><code>EXPLAIN (ANALYZE, BUFFERS)<\/code><\/td>\n<td>Missing index, bloat, stale stats, connection pile-up<\/td>\n<td>Index, <code>VACUUM<\/code> / autovacuum, <code>ANALYZE<\/code>, connection pooling<\/td>\n<\/tr>\n<tr>\n<td><strong>Glue<\/strong><\/td>\n<td>Job metrics, Spark UI, number of input files<\/td>\n<td>Too many small files, skew, too few workers<\/td>\n<td><code>groupFiles<\/code>, more workers or auto scaling, pushdown<\/td>\n<\/tr>\n<tr>\n<td><strong>Athena<\/strong><\/td>\n<td>Data scanned, partition pruning<\/td>\n<td>No partitioning, text formats, small files<\/td>\n<td>Parquet, partitions, compaction<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Follow-ups<\/strong>\n- <em>Q: One task runs 50 minutes and the rest 40 seconds.<\/em> A: Skew. Find the hot key (often NULL or a default value) and isolate it, salt it, or let AQE split it.\n- <em>Q: It was fast yesterday.<\/em> A: Check data volume growth, a plan change after stats or schema changes, and what else is running concurrently.<\/p>", "tag": "Classic"}, {"q": "Failure checklist by tool", "a": "<table>\n<thead>\n<tr>\n<th>Tool<\/th>\n<th>Common failure<\/th>\n<th>Where to look<\/th>\n<th>Typical fix<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Glue<\/strong><\/td>\n<td>Out of memory, skipped files after bookmark, IAM denied<\/td>\n<td>CloudWatch logs, job metrics, Spark UI<\/td>\n<td>More workers, group files, reset bookmark, fix the role<\/td>\n<\/tr>\n<tr>\n<td><strong>Airflow<\/strong><\/td>\n<td>Task stuck in queued, sensor timeout, DAG import error, pool full<\/td>\n<td>Scheduler and task logs, DAG import errors<\/td>\n<td>Fix the code, increase slots or pool, adjust the timeout<\/td>\n<\/tr>\n<tr>\n<td><strong>Lambda + Kinesis<\/strong><\/td>\n<td><code>IteratorAge<\/code> rising, throttling, poison record<\/td>\n<td>CloudWatch metrics, the DLQ<\/td>\n<td>Bisect batches, DLQ, reserved concurrency, fix the record<\/td>\n<\/tr>\n<tr>\n<td><strong>Databricks pipelines<\/strong><\/td>\n<td>Expectation failure, schema mismatch, checkpoint problems<\/td>\n<td>Pipeline event log, Spark UI<\/td>\n<td>Fix the data or schema, targeted refresh instead of a full refresh<\/td>\n<\/tr>\n<tr>\n<td><strong>Snowflake<\/strong><\/td>\n<td>Task suspended after failures, stale stream, <code>COPY<\/code> errors, queued queries<\/td>\n<td><code>TASK_HISTORY<\/code>, <code>COPY_HISTORY<\/code>, <code>QUERY_HISTORY<\/code><\/td>\n<td>Fix and resume the task, consume the stream, resize or add warehouses<\/td>\n<\/tr>\n<tr>\n<td><strong>Redshift<\/strong><\/td>\n<td><code>COPY<\/code> errors, disk full, WLM queueing<\/td>\n<td>Load error system tables (such as <code>STL_LOAD_ERRORS<\/code>), WLM views<\/td>\n<td>Fix the file format, <code>VACUUM<\/code>, WLM tuning<\/td>\n<\/tr>\n<tr>\n<td><strong>Kafka<\/strong><\/td>\n<td>Consumer lag, rebalances, retention too short<\/td>\n<td>Lag metrics, consumer group status<\/td>\n<td>Scale consumers up to the partition count, tune poll settings<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "tag": "Classic"}, {"q": "Running an incident: communication and post-mortem", "a": "<p><strong>During<\/strong>\n- One <strong>incident lead<\/strong>; everyone else supports.\n- Short, regular updates in plain language: <strong>impact, what we know, next update time<\/strong>.\n- Mitigate first (serve last good, pause bad jobs), find root cause second.<\/p>\n<p><strong>After (blameless post-mortem)<\/strong>\n- Timeline from detection to resolution; time to detect and time to recover.\n- Root cause, asking \"why\" until you reach a process or design gap, not a person.\n- What went well, what didn't.\n- <strong>Action items with owners and dates<\/strong>: a test, an alert, a runbook, or a design change.<\/p>\n<p><strong>Follow-ups<\/strong>\n- <em>Q: What do you write to executives?<\/em> A: Three lines: what happened, who or what was affected and for how long, and what we are changing so it won't repeat.\n- <em>Q: How do you know the fix worked?<\/em> A: A monitor that would have caught it, plus a game-day or replay that proves it.<\/p>", "tag": "Classic"}], "id": "sc-troubleshooting"}, {"name": "Hard scenarios to memorize", "group": "Scenarios by type", "items": [{"q": "How to memorize these (and a five-minute recall drill)", "a": "<p><strong>The spine<\/strong> for every scenario (say it out loud): <strong>Clarify, Detect, Contain, Fix, Prevent.<\/strong><\/p>\n<p><strong>Three keywords<\/strong> to land in every answer: <strong>idempotent, replayable, observable.<\/strong><\/p>\n<p><strong>For each scenario, memorize four things<\/strong>\n1. The <strong>trigger phrase<\/strong> (what the interviewer says).\n2. The <strong>one design decision<\/strong> that matters most.\n3. The <strong>trade-off<\/strong> you accept.\n4. A <strong>number or story<\/strong> from your own experience.<\/p>\n<p><strong>Recall drill, five minutes<\/strong>\n1. Pick a card at random from the list below.\n2. Answer out loud for 90 seconds using the spine.\n3. Open the answer and mark what you missed.\n4. Repeat the ones you missed tomorrow.<\/p>\n<p><strong>Story bank<\/strong>: prepare five real stories (a late-data fix, a backfill, a cost reduction, a streaming incident, a data-quality catch). Each story can answer several scenarios, so you don't need one per question.<\/p>\n<p><strong>Study plan<\/strong>\n| Day | Focus |\n|---|---|\n| 1 | Classic: ingestion and late data |\n| 2 | Classic: backfill and data quality |\n| 3 | Classic: troubleshooting |\n| 4 | Hard scenarios, first half |\n| 5 | Hard scenarios, second half |\n| 6 | Very hard scenarios, spoken aloud |\n| 7 | Mock interview from the Practice section |<\/p>"}, {"q": "Exactly-once, end to end", "a": "<p><strong>Why it is hard<\/strong>: exactly-once delivery doesn't exist across independent systems. You build <strong>effectively-once<\/strong> results.<\/p>\n<p><strong>Answer<\/strong>\n1. Source is <strong>replayable<\/strong> (Kafka offsets, files), so retries re-read the same data.\n2. Processing is <strong>deterministic<\/strong> (same input, same output).\n3. The sink is <strong>idempotent<\/strong> (<code>MERGE<\/code> on key plus version) or <strong>transactional<\/strong> (atomic table commits tied to the checkpoint).\n4. Every record has a <strong>stable key<\/strong>, so duplicates collapse.\n5. External side effects (emails, API calls) use <strong>idempotency keys<\/strong>.<\/p>\n<table>\n<thead>\n<tr>\n<th>Where it breaks<\/th>\n<th>Fix<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Producer retries create duplicates<\/td>\n<td>Idempotent producer, or dedupe on the event id<\/td>\n<\/tr>\n<tr>\n<td>Consumer commits offsets before writing<\/td>\n<td>Commit after the write, or use a transactional sink<\/td>\n<\/tr>\n<tr>\n<td>Sink append without a key<\/td>\n<td>Upsert on key<\/td>\n<\/tr>\n<tr>\n<td>Non-deterministic logic (<code>now()<\/code>, random)<\/td>\n<td>Take values from the event, not the clock<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Follow-ups<\/strong>\n- <em>Q: Does Kafka give exactly-once?<\/em> A: Within Kafka (idempotent producers plus transactions) yes; end to end it still depends on your sink.\n- <em>Q: Why not just dedupe at the end?<\/em> A: You can, but the sink must still tolerate retries mid-flight, and downstream consumers may already have read duplicates.<\/p>\n<p><strong>Memorize<\/strong>: at-least-once delivery plus an idempotent write equals effectively-once.<\/p>", "tag": "Very hard"}, {"q": "Restate 90 days of revenue after a bug, with consumers watching", "a": "<p><strong>Answer<\/strong>\n1. <strong>Version the metric<\/strong> (v1 old, v2 corrected) rather than silently overwriting.\n2. Build v2 <strong>in the background<\/strong>, validate it, and produce a <strong>bridge<\/strong>: old total to new total, broken down by cause.\n3. Agree with finance on <strong>closed periods<\/strong> and what may be restated.\n4. <strong>Communicate<\/strong> the change date and the expected differences before anyone finds them.\n5. <strong>Switch<\/strong> consumers on a planned date; keep v1 archived for audit.\n6. Add a <strong>changelog<\/strong> and a test that would have caught the bug.<\/p>\n<p><strong>Follow-ups<\/strong>\n- <em>Q: A report was already sent to the board.<\/em> A: Don't change the sent report quietly. Issue a documented correction with the bridge.\n- <em>Q: Can you do it without a freeze?<\/em> A: Yes, if v2 is published beside v1 and consumers move one at a time.<\/p>\n<p><strong>Memorize<\/strong>: shadow, bridge, switch, archive.<\/p>", "tag": "Hard"}, {"q": "Late data into a 5-billion-row table, with incremental gold only", "a": "<p><strong>Goal<\/strong>: touch only what changed, not 5 billion rows.<\/p>\n<p><strong>Answer<\/strong>\n1. Find <strong>changed keys<\/strong> from a change feed (Delta Change Data Feed, Snowflake streams) or an <code>updated_at<\/code> high-water mark plus a lookback.\n2. Derive the <strong>affected partitions<\/strong>, including the <strong>old<\/strong> date of any row that moved (the pre-image), not only the new date.\n3. Recompute aggregates <strong>only for those partitions<\/strong> and <code>MERGE<\/code> them into gold.\n4. Cost is proportional to the changes, not to the table.<\/p>\n<pre><code class=\"language-sql\">WITH changed AS (\n  SELECT DISTINCT order_date FROM table_changes('silver.orders', :last_version)\n  WHERE _change_type IN ('insert', 'update_postimage', 'update_preimage', 'delete')\n)\nMERGE INTO gold.daily_revenue g\nUSING (\n  SELECT o.order_date, SUM(o.amount) AS revenue, COUNT(*) AS orders\n  FROM silver.orders o JOIN changed c ON o.order_date = c.order_date\n  GROUP BY o.order_date\n) s\nON g.order_date = s.order_date\nWHEN MATCHED THEN UPDATE SET g.revenue = s.revenue, g.orders = s.orders\nWHEN NOT MATCHED THEN INSERT (order_date, revenue, orders) VALUES (s.order_date, s.revenue, s.orders);\n<\/code><\/pre>\n<p><strong>Follow-ups<\/strong>\n- <em>Q: A date had all its rows deleted.<\/em> A: It won't appear in the source query, so gold keeps a stale row. Handle it with a delete clause for dates in the changed set.\n- <em>Q: Why not a materialized view or dynamic table?<\/em> A: Often the right answer: let the engine do incremental maintenance. Hand-written logic is for when you need control or the engine falls back to full recompute.<\/p>\n<p><strong>Memorize<\/strong>: changed keys, affected partitions (old and new), recompute, merge.<\/p>", "tag": "Hard"}, {"q": "Zero-downtime migration (Redshift or Hive to Snowflake or Delta)", "a": "<p><strong>Answer<\/strong>\n1. <strong>Inventory<\/strong> tables, jobs, consumers and SLAs; rank by risk.\n2. <strong>Dual-run<\/strong>: backfill history, then keep the new platform in sync with CDC or the same pipelines.\n3. <strong>Parity testing<\/strong>: row counts, checksums, and the results of the top dashboards' queries compared across both systems.\n4. <strong>Shadow reads<\/strong>: point a few consumers at the new platform while the old one stays authoritative.\n5. <strong>Cut over by consumer group<\/strong> (strangler pattern), each with a rollback.\n6. <strong>Retire<\/strong> the old system only after several clean cycles.<\/p>\n<p><strong>Hidden costs<\/strong>: SQL dialect differences (Redshift distribution and sort keys have no direct equivalent in Snowflake), permissions and masking, scheduling, cost model, and consumer retraining.<\/p>\n<p><strong>Follow-ups<\/strong>\n- <em>Q: Parity differs by 0.01%.<\/em> A: Find out why (rounding, time zones, null handling), decide which system is right, and document it. Never wave it away.\n- <em>Q: How long do you run both?<\/em> A: Until at least one full business cycle (month-end close) matches.<\/p>\n<p><strong>Memorize<\/strong>: sync, compare, switch, retire.<\/p>", "tag": "Very hard"}, {"q": "Delete a person's data (PII) across every layer", "a": "<p><strong>Problem<\/strong>: bronze is immutable, time travel keeps old versions, and backups exist. (This is the engineering pattern, not legal advice.)<\/p>\n<p><strong>Answer<\/strong>\n1. Minimize PII at ingestion: <strong>tokenize or hash<\/strong> identifiers, keeping the mapping in a separate, access-controlled store.\n2. Keep a <strong>deletion request table<\/strong>.\n3. <strong>Propagate<\/strong> to silver and gold with <code>DELETE<\/code> or <code>MERGE ... WHEN MATCHED THEN DELETE<\/code>.\n4. In Delta, run <code>VACUUM<\/code> after the retention window so old files holding the data are removed; in Snowflake, deleted data stays in Time Travel and Fail-safe for their windows.\n5. <strong>Crypto-shredding<\/strong>: encrypt per-person data with a key you can delete, so history becomes unreadable.\n6. Let backups age out under a documented retention, and keep <strong>audit evidence<\/strong> of the deletion.<\/p>\n<p><strong>Follow-ups<\/strong>\n- <em>Q: Time travel still contains the data.<\/em> A: Reduce retention for PII tables, or design with crypto-shredding so retention doesn't matter.\n- <em>Q: How do you prove it?<\/em> A: A completion record per request, plus a query showing the identifier no longer exists in any layer.<\/p>\n<p><strong>Memorize<\/strong>: tokenize, propagate, vacuum, shred the key, prove it.<\/p>", "tag": "Hard"}, {"q": "CDC with out-of-order events, deletes and replays", "a": "<p><strong>Rules<\/strong>\n- Order by the source <strong>sequence<\/strong> (LSN), never arrival time.\n- Keep <strong>tombstones<\/strong> with their sequence so older events can't resurrect deleted rows.\n- Make apply <strong>idempotent<\/strong>: the same change applied twice gives the same state.\n- Dedupe within each batch before the <code>MERGE<\/code>.\n- Keep the <strong>raw change log<\/strong> so you can rebuild silver by replay.<\/p>\n<p><strong>Test it properly<\/strong>: take a set of change events, apply them in many random orders and with duplicates, and assert the final table is always identical. This catches ordering bugs that normal tests miss.<\/p>\n<p><strong>Follow-ups<\/strong>\n- <em>Q: A replay of last week's events overwrites newer data.<\/em> A: The sequence guard (<code>s.lsn &gt; t.lsn<\/code>) prevents it. Without the guard, replays are dangerous.\n- <em>Q: Compaction of the change log?<\/em> A: Keep the latest change per key plus tombstones, only after consumers have caught up.<\/p>\n<p><strong>Memorize<\/strong>: sequence, tombstone, idempotent apply, shuffle test.<\/p>", "tag": "Very hard"}, {"q": "Slowly changing dimension with late-arriving history", "a": "<p><strong>Scenario<\/strong>: A customer's tier change effective three weeks ago arrives today, so version ranges for that customer are now wrong, and facts joined to the old range are wrong too.<\/p>\n<p><strong>Answer<\/strong>\n1. Collect <strong>all versions<\/strong> for the affected keys plus the late change.\n2. <strong>Re-sort<\/strong> by effective date and <strong>re-close<\/strong> each version's end date with <code>LEAD<\/code>.\n3. Rewrite those keys' rows (<code>MERGE<\/code> or replace).\n4. <strong>Re-key the facts<\/strong> whose dates fall in the changed range, so they point at the right dimension version.<\/p>\n<pre><code class=\"language-sql\">SELECT customer_id, tier, effective_from,\n       COALESCE(LEAD(effective_from) OVER (PARTITION BY customer_id ORDER BY effective_from),\n                DATE '9999-12-31') AS effective_to,\n       LEAD(effective_from) OVER (PARTITION BY customer_id ORDER BY effective_from) IS NULL AS is_current\nFROM (\n  SELECT customer_id, tier, effective_from FROM dim_customer\n  WHERE customer_id IN (SELECT customer_id FROM late_changes)\n  UNION ALL\n  SELECT customer_id, tier, effective_from FROM late_changes\n) v;\n<\/code><\/pre>\n<p><strong>Follow-ups<\/strong>\n- <em>Q: Can you avoid re-keying facts?<\/em> A: Join facts to the dimension on the natural key and date range at query time (a view), at some read cost.\n- <em>Q: Two changes with the same effective date?<\/em> A: Break ties with the source version or load order, and decide the rule once.<\/p>\n<p><strong>Memorize<\/strong>: re-sort, re-close, re-key.<\/p>", "tag": "Hard"}, {"q": "Black Friday: ten times the volume with skew, small files and cost pressure", "a": "<p><strong>Answer, before the event<\/strong>\n- <strong>Load test<\/strong> at 10x using last year's shape, not a flat multiple.\n- Autoscaling <strong>headroom<\/strong> and quotas raised ahead of time.\n- Skew handling in place: AQE, salted hot keys, isolated guest or default keys.\n- <strong>Backpressure<\/strong> on streams (<code>maxOffsetsPerTrigger<\/code>), sensible partition sizes.\n- <strong>Isolation<\/strong>: a dedicated cluster or warehouse so BI isn't starved.\n- A <strong>degraded mode<\/strong> agreed in advance (for example, drop non-critical enrichment).<\/p>\n<p><strong>During<\/strong>: watch lag, queue depth and cost; follow a runbook with owners.<\/p>\n<p><strong>After<\/strong>: <code>OPTIMIZE<\/code> or compaction for small files, scale back down, review cost and lessons.<\/p>\n<p><strong>Follow-up<\/strong>\n- <em>Q: Lag is growing and you can't add partitions.<\/em> A: Increase consumer parallelism up to the partition count, speed the sink (batch writes), fix the hot key, and fall back to the degraded mode if needed.<\/p>\n<p><strong>Memorize<\/strong>: test, headroom, isolate, degrade, clean up.<\/p>", "tag": "Hard"}, {"q": "Design ingestion for 200 sources", "a": "<p><strong>Answer: config, not code<\/strong>\n1. A <strong>metadata table<\/strong> describes each source: location, format, schedule, schema contract, quality rules, owner, SLA.\n2. <strong>Generic ingestion templates<\/strong> per type (file, database CDC, API, stream) driven by that metadata.\n3. Orchestration generates the DAGs (Airflow dynamic DAG generation or dynamic task mapping).\n4. A <strong>standard bronze layout<\/strong> and <strong>audit columns<\/strong> (source, batch id, load time, file name).\n5. A shared <strong>quality framework<\/strong> and a <strong>schema registry<\/strong>.\n6. <strong>Failure isolation<\/strong>: one failing source doesn't block the others.\n7. <strong>Observability<\/strong>: freshness and volume per source on one dashboard.\n8. An <strong>onboarding process<\/strong>: a new source is a config change plus a review, not a new project.<\/p>\n<p><strong>Follow-ups<\/strong>\n- <em>Q: Sources need special handling.<\/em> A: Allow a custom hook per source but keep it the exception, reviewed, and tested.\n- <em>Q: How do you control cost?<\/em> A: Per-source tags and budgets, shared compute pools, and incremental loads only.<\/p>\n<p><strong>Memorize<\/strong>: config, templates, isolation, one dashboard.<\/p>", "tag": "Very hard"}, {"q": "Disaster recovery for the lake and warehouse", "a": "<p><strong>Start with numbers<\/strong>: <strong>RPO<\/strong> (how much data you can lose) and <strong>RTO<\/strong> (how long you can be down), agreed with the business.<\/p>\n<p><strong>Answer<\/strong>\n- <strong>S3<\/strong>: versioning plus cross-region replication for raw and curated data.\n- <strong>Delta / Iceberg<\/strong>: replicate tables or deep clone to the DR region; catalog metadata must be replicated too.\n- <strong>Snowflake<\/strong>: database replication and failover groups to another region or account.\n- <strong>Redshift<\/strong>: cross-region snapshots.\n- <strong>Everything else<\/strong>: infrastructure as code, replicated secrets, and a runbook.\n- <strong>Test it<\/strong>: scheduled restore drills. An untested backup isn't a backup.<\/p>\n<p><strong>Follow-ups<\/strong>\n- <em>Q: Replication copies a corruption too.<\/em> A: Replication isn't backup. Keep point-in-time recovery (Time Travel, versioning, snapshots) in addition.\n- <em>Q: How do you decide the cost?<\/em> A: Match the tier to the dataset's RPO and RTO; not everything needs hot standby.<\/p>\n<p><strong>Memorize<\/strong>: RPO and RTO first, replicate, keep point-in-time recovery, drill it.<\/p>", "tag": "Hard"}], "id": "sc-hard"}, {"id": "tools-aws-glue-airflow", "name": "Tools: AWS, Glue, Airflow", "items": [{"q": "TA1. AWS data platform map (what each service is for)", "a": "<table>\n<thead>\n<tr>\n<th>Layer<\/th>\n<th>Service<\/th>\n<th>Role in the orders pipeline<\/th>\n<th>One-line interview point<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Storage<\/td>\n<td><strong>S3<\/strong><\/td>\n<td>Raw (bronze), curated (silver), gold zones as prefixes/buckets<\/td>\n<td>Partition by <code>event_date<\/code>; keep raw immutable so you can always replay<\/td>\n<\/tr>\n<tr>\n<td>Catalog<\/td>\n<td><strong>Glue Data Catalog<\/strong><\/td>\n<td>Table and partition metadata shared by Glue, Athena, Redshift Spectrum, EMR<\/td>\n<td>One catalog, many engines<\/td>\n<\/tr>\n<tr>\n<td>Governance<\/td>\n<td><strong>Lake Formation + IAM + KMS<\/strong><\/td>\n<td>Table/column/row permissions, encryption<\/td>\n<td>Column-level masking for PII; least-privilege roles per job<\/td>\n<\/tr>\n<tr>\n<td>Ingest (stream)<\/td>\n<td><strong>Kinesis / MSK + Firehose<\/strong><\/td>\n<td>Events to S3 and to consumers<\/td>\n<td>Firehose lands raw to S3 in micro-batches<\/td>\n<\/tr>\n<tr>\n<td>Ingest (CDC)<\/td>\n<td><strong>DMS<\/strong><\/td>\n<td>Database changes (e.g. Postgres) to S3 or Kinesis<\/td>\n<td>Full load plus ongoing CDC; handles initial snapshot<\/td>\n<\/tr>\n<tr>\n<td>Transform<\/td>\n<td><strong>Glue ETL (Spark)<\/strong><\/td>\n<td>Serverless batch/streaming Spark<\/td>\n<td>No cluster to manage; billed by DPU-time<\/td>\n<\/tr>\n<tr>\n<td>Query<\/td>\n<td><strong>Athena<\/strong><\/td>\n<td>SQL over S3 (pay per data scanned)<\/td>\n<td>Parquet plus partitions cut the bill<\/td>\n<\/tr>\n<tr>\n<td>Warehouse<\/td>\n<td><strong>Redshift<\/strong><\/td>\n<td>Gold-layer BI<\/td>\n<td><code>COPY<\/code> from S3, Spectrum for lake data<\/td>\n<\/tr>\n<tr>\n<td>Orchestration<\/td>\n<td><strong>MWAA (Airflow) / Step Functions<\/strong><\/td>\n<td>Schedule, dependencies, retries, backfills<\/td>\n<td>Airflow for data pipelines, Step Functions for service workflows<\/td>\n<\/tr>\n<tr>\n<td>Monitoring<\/td>\n<td><strong>CloudWatch + EventBridge<\/strong><\/td>\n<td>Metrics, alarms, event triggers<\/td>\n<td>Alarm on freshness and row counts, not only job failure<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Follow-ups<\/strong>\n- <em>Q: Glue, EMR, or Lambda for a transform?<\/em> A: Lambda for small, short (under 15 min) event-driven work. Glue for serverless Spark with little ops. EMR when you need cluster-level control (custom libraries, tuning, long-running or very large jobs).\n- <em>Q: How do you keep Athena cost down?<\/em> A: Columnar format (Parquet), partition pruning, compaction to avoid small files, and select only needed columns.\n- <em>Q: How is PII protected on S3?<\/em> A: KMS encryption at rest, TLS in transit, Lake Formation column/row filters, tokenize or hash sensitive fields at ingestion, CloudTrail for audit.<\/p>"}, {"q": "TA2. Glue ingestion jobs (bookmarks, pushdown, small files, quality)", "a": "<p><strong>Scenario<\/strong>: A Glue job ingests daily order files from S3 into curated Parquet. It must not reprocess old files, must handle small files, and must reject bad data.<\/p>\n<p><strong>Answer<\/strong>\n- <strong>Job bookmarks<\/strong> remember what was processed so reruns skip old files. They need <code>job.init()<\/code>, <code>job.commit()<\/code> and a unique <code>transformation_ctx<\/code> on each source.\n- <strong>Pushdown predicate<\/strong> limits which partitions are even listed and read.\n- <strong>Small files<\/strong>: group input files with <code>groupFiles<\/code> and <code>groupSize<\/code>.\n- <strong>Dynamic partition overwrite<\/strong> so a rerun replaces only the partitions it touches (idempotent).\n- <strong>Glue Data Quality<\/strong> (DQDL rules) as a gate before publishing.<\/p>\n<pre><code class=\"language-python\">import sys\nfrom awsglue.context import GlueContext\nfrom awsglue.job import Job\nfrom awsglue.utils import getResolvedOptions\nfrom pyspark.context import SparkContext\n\nargs = getResolvedOptions(sys.argv, [&quot;JOB_NAME&quot;, &quot;start_date&quot;, &quot;end_date&quot;])\nsc = SparkContext()\nglue = GlueContext(sc)\nspark = glue.spark_session\nspark.conf.set(&quot;spark.sql.sources.partitionOverwriteMode&quot;, &quot;dynamic&quot;)\njob = Job(glue); job.init(args[&quot;JOB_NAME&quot;], args)\n\ndyf = glue.create_dynamic_frame.from_catalog(\n    database=&quot;raw&quot;, table_name=&quot;orders&quot;,\n    push_down_predicate=f&quot;order_date &gt;= '{args['start_date']}' AND order_date &lt;= '{args['end_date']}'&quot;,\n    additional_options={&quot;groupFiles&quot;: &quot;inPartition&quot;, &quot;groupSize&quot;: &quot;134217728&quot;},\n    transformation_ctx=&quot;src_orders&quot;)\n\ndf = (dyf.toDF()\n      .filter(&quot;order_id IS NOT NULL AND amount &gt;= 0&quot;)\n      .dropDuplicates([&quot;order_id&quot;, &quot;updated_at&quot;]))\n\n(df.write.mode(&quot;overwrite&quot;).partitionBy(&quot;order_date&quot;)\n   .parquet(&quot;s3://lake/curated/orders/&quot;))\njob.commit()\n<\/code><\/pre>\n<p>Glue Data Quality ruleset (DQDL):<\/p>\n<pre><code>Rules = [\n  RowCount &gt; 0,\n  IsComplete &quot;order_id&quot;,\n  IsUnique &quot;order_id&quot;,\n  ColumnValues &quot;amount&quot; &gt;= 0,\n  Completeness &quot;customer_id&quot; &gt; 0.99\n]\n<\/code><\/pre>\n<p><strong>Follow-ups<\/strong>\n- <em>Q: How do you backfill with bookmarks on?<\/em> A: Bookmarks would skip files already seen. Either reset the bookmark (<code>aws glue reset-job-bookmark<\/code>), run with bookmarks disabled on an explicit date range, or pass <code>start_date<\/code>/<code>end_date<\/code> arguments and rely on partition overwrite for idempotency. The parameterized approach is the cleanest and leaves the normal bookmark state alone.\n- <em>Q: Bookmarks vs your own watermark table?<\/em> A: Bookmarks are convenient for append-only S3 files. They are weak for late updates to existing files and hard to inspect, so for updates or critical pipelines keep an explicit high-water mark or process by partition.\n- <em>Q: Crawlers or defined tables?<\/em> A: Crawlers are fine for discovery. In production define the schema explicitly, because a crawler can silently change types when the source drifts.\n- <em>Q: DynamicFrame or DataFrame?<\/em> A: DynamicFrame tolerates mixed-type columns (<code>ResolveChoice<\/code>), which helps with messy sources. Convert to DataFrame for most transformations and for writes.\n- <em>Q: The job is slow. What do you check?<\/em> A: Number and size of input files, skew in the Spark UI, worker type and count (or auto scaling), shuffle partitions, and whether pushdown is actually pruning partitions.<\/p>"}, {"q": "TA3. Airflow orchestration (idempotent DAGs, backfills, sensors)", "a": "<p><strong>Scenario<\/strong>: Orchestrate S3 arrival, Glue transform, quality gate, then load to the warehouse. It must be safe to rerun and to backfill 30 days.<\/p>\n<p><strong>Answer<\/strong>\n- Tasks use the <strong>data interval<\/strong> (<code>{{ data_interval_start }}<\/code>, <code>{{ ds }}<\/code>), not \"now\", so a run for a past date processes that date's data.\n- Every task is <strong>idempotent<\/strong>: overwrite a partition or <code>MERGE<\/code>, never blind append.\n- <code>max_active_runs=1<\/code> where runs must not overlap; <code>retries<\/code> with backoff for transient failures.\n- <strong>Sensors<\/strong> wait for files. Use <code>mode=\"reschedule\"<\/code> or deferrable operators so a waiting task doesn't hold a worker slot.\n- <strong>Quality gate<\/strong> task fails the DAG before the publish step, so bad data never reaches consumers.<\/p>\n<pre><code class=\"language-python\">from datetime import datetime, timedelta\nfrom airflow import DAG\nfrom airflow.providers.amazon.aws.sensors.s3 import S3KeySensor\nfrom airflow.providers.amazon.aws.operators.glue import GlueJobOperator\nfrom airflow.operators.python import PythonOperator\n\nwith DAG(\n    dag_id=&quot;orders_daily&quot;,\n    start_date=datetime(2026, 9, 1),\n    schedule=&quot;0 2 * * *&quot;,\n    catchup=False,\n    max_active_runs=1,\n    default_args={&quot;retries&quot;: 3, &quot;retry_delay&quot;: timedelta(minutes=5), &quot;retry_exponential_backoff&quot;: True},\n) as dag:\n\n    wait_files = S3KeySensor(\n        task_id=&quot;wait_for_files&quot;,\n        bucket_name=&quot;lake&quot;,\n        bucket_key=&quot;raw/orders/order_date={{ ds }}/_SUCCESS&quot;,\n        mode=&quot;reschedule&quot;, poke_interval=300, timeout=6 * 3600)\n\n    transform = GlueJobOperator(\n        task_id=&quot;glue_transform&quot;,\n        job_name=&quot;orders_curated&quot;,\n        script_args={&quot;--start_date&quot;: &quot;{{ ds }}&quot;, &quot;--end_date&quot;: &quot;{{ ds }}&quot;},\n        wait_for_completion=True)\n\n    def quality_gate(ds, **_):\n        # compare row counts / sums against source manifest; raise on mismatch\n        ...\n\n    check = PythonOperator(task_id=&quot;quality_gate&quot;, python_callable=quality_gate)\n\n    wait_files &gt;&gt; transform &gt;&gt; check\n<\/code><\/pre>\n<p>Backfill (Airflow 2 CLI; the command differs in Airflow 3):<\/p>\n<pre><code>airflow dags backfill -s 2026-09-01 -e 2026-09-30 --reset-dagruns orders_daily\n<\/code><\/pre>\n<p><strong>Follow-ups<\/strong>\n- <em>Q: <code>catchup=True<\/code> or <code>False<\/code>?<\/em> A: <code>False<\/code> for most pipelines so a long pause doesn't trigger hundreds of runs. Use explicit backfills when you want history. <code>True<\/code> only when every missed interval must run automatically.\n- <em>Q: What goes in XCom?<\/em> A: Small metadata only (paths, counts, run ids). Never datasets, because XCom lives in the metadata database.\n- <em>Q: A task succeeded but the data is wrong?<\/em> A: Add explicit data checks as tasks (row counts, nulls, freshness) and fail the DAG on them. A green task only means the code ran.\n- <em>Q: Process 100 tables with one DAG?<\/em> A: Dynamic task mapping (<code>.expand()<\/code>) or generate tasks from config, with <code>pool<\/code> limits so you don't overload the warehouse.\n- <em>Q: How do you trigger when upstream data lands rather than on a clock?<\/em> A: Sensors, or data-aware scheduling (Datasets/Assets) so a downstream DAG runs when an upstream task updates its output.\n- <em>Q: Airflow or Glue workflows?<\/em> A: Glue workflows are fine for a Glue-only chain. Airflow wins for cross-system pipelines (Glue, Databricks, Snowflake, Redshift), backfills, and richer retry/alerting.<\/p>"}, {"q": "TA4. End-to-end flow on AWS (what to draw on the whiteboard)", "a": "<pre><code>Sources (app DB, files, events)\n   -&gt; DMS / Firehose / Kinesis ........ ingestion\n   -&gt; S3 raw (immutable)               bronze\n   -&gt; Glue ETL (clean, dedupe, DQ)     silver, Parquet, partitioned by event_date\n   -&gt; Glue/Databricks/dbt (aggregate)  gold\n   -&gt; Redshift / Snowflake / Athena    serving\nAirflow (MWAA) orchestrates every hop; CloudWatch alarms on freshness and volume.\n<\/code><\/pre>\n<p><strong>Failure handling to mention<\/strong>\n- Ingestion fails: files stay in raw; the rerun is idempotent.\n- Transform fails: bookmark/partition overwrite means no partial data is published.\n- Quality fails: DAG stops before publish; bad rows go to a quarantine prefix with the reason.\n- Late files: lookback window in the daily job reprocesses the last N partitions.<\/p>"}], "group": "Tools & skills"}, {"id": "tools-databricks", "name": "Tools: Databricks lakehouse", "items": [{"q": "TD1. Upserts with MERGE (batch and streaming)", "a": "<p><strong>Scenario<\/strong>: The source sends inserts, updates and deletes for orders, sometimes out of order and sometimes duplicated. Keep silver correct and the job rerunnable.<\/p>\n<pre><code class=\"language-sql\">MERGE INTO silver.orders AS t\nUSING (\n  SELECT * FROM bronze.orders_batch\n  QUALIFY ROW_NUMBER() OVER (PARTITION BY order_id ORDER BY updated_at DESC) = 1\n) AS s\nON t.order_id = s.order_id AND t.order_date &gt;= current_date() - 7   -- prune files\nWHEN MATCHED AND s.op = 'DELETE' THEN DELETE\nWHEN MATCHED AND s.updated_at &gt; t.updated_at THEN UPDATE SET *\nWHEN NOT MATCHED AND s.op &lt;&gt; 'DELETE' THEN INSERT *;\n<\/code><\/pre>\n<p>Streaming version with <code>foreachBatch<\/code>:<\/p>\n<pre><code class=\"language-python\">from delta.tables import DeltaTable\n\ndef upsert(batch_df, batch_id):\n    latest = (batch_df.withColumn(&quot;rn&quot;, F.row_number().over(\n                 Window.partitionBy(&quot;order_id&quot;).orderBy(F.col(&quot;updated_at&quot;).desc())))\n              .filter(&quot;rn = 1&quot;).drop(&quot;rn&quot;))\n    (DeltaTable.forName(spark, &quot;silver.orders&quot;).alias(&quot;t&quot;)\n        .merge(latest.alias(&quot;s&quot;), &quot;t.order_id = s.order_id&quot;)\n        .whenMatchedUpdateAll(condition=&quot;s.updated_at &gt; t.updated_at&quot;)\n        .whenNotMatchedInsertAll()\n        .execute())\n\n(spark.readStream.table(&quot;bronze.orders&quot;)\n   .writeStream.foreachBatch(upsert)\n   .option(&quot;checkpointLocation&quot;, &quot;s3://lake/chk/silver_orders&quot;)\n   .trigger(availableNow=True).start())\n<\/code><\/pre>\n<p><strong>Follow-ups<\/strong>\n- <em>Q: \"Multiple source rows matched\" error?<\/em> A: Several source rows hit one target row. Dedupe the source first (above).\n- <em>Q: Why the <code>updated_at<\/code> guard?<\/em> A: Out-of-order and replayed data must not overwrite newer rows. It also makes reruns idempotent.\n- <em>Q: MERGE is slow on a big table.<\/em> A: Add a partition or clustering predicate in <code>ON<\/code> to prune files, cluster on the merge key (liquid clustering), use deletion vectors / low-shuffle merge, and compact small files with <code>OPTIMIZE<\/code>.\n- <em>Q: Two jobs MERGE the same table and one fails?<\/em> A: <code>ConcurrentAppendException<\/code> from optimistic concurrency. Make writers touch disjoint partitions (put it in the <code>ON<\/code> clause), enable row-level concurrency, or serialize with retry.\n- <em>Q: MERGE or <code>AUTO CDC<\/code> / <code>apply_changes<\/code>?<\/em> A: For CDC feeds in a declarative pipeline, <code>apply_changes<\/code> (called <code>AUTO CDC<\/code> in newer docs) handles ordering by <code>sequence_by<\/code>, deletes and SCD1/SCD2 for you. Use hand-written MERGE when you need custom logic.<\/p>"}, {"q": "TD2. Streaming tables vs materialized views vs views", "a": "<table>\n<thead>\n<tr>\n<th><\/th>\n<th><strong>Streaming table<\/strong><\/th>\n<th><strong>Materialized view<\/strong><\/th>\n<th><strong>View<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Input<\/td>\n<td>Append-only streaming source (files, Kafka, another streaming table)<\/td>\n<td>Any SQL query, including joins and aggregations<\/td>\n<td>Any SQL query<\/td>\n<\/tr>\n<tr>\n<td>Processing<\/td>\n<td>Each new row processed once, incrementally<\/td>\n<td>Result stored; refreshed incrementally when possible, otherwise recomputed<\/td>\n<td>Recomputed on every query<\/td>\n<\/tr>\n<tr>\n<td>Storage<\/td>\n<td>Yes<\/td>\n<td>Yes<\/td>\n<td>No<\/td>\n<\/tr>\n<tr>\n<td>Handles late/corrected source data<\/td>\n<td>Only what arrives as new rows<\/td>\n<td><strong>Yes<\/strong>, refresh reflects the current source<\/td>\n<td>Yes (always current)<\/td>\n<\/tr>\n<tr>\n<td>Best for<\/td>\n<td>Bronze ingestion, silver cleaning<\/td>\n<td><strong>Gold<\/strong> aggregates and joins<\/td>\n<td>Light logic, security filters<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<pre><code class=\"language-sql\">-- BRONZE: streaming table, Auto Loader via read_files\nCREATE OR REFRESH STREAMING TABLE bronze_orders\nAS SELECT *, current_timestamp() AS _ingest_ts, _metadata.file_path AS _source_file\nFROM STREAM read_files('s3://lake/raw/orders/', format =&gt; 'json');\n\n-- SILVER: streaming table with data-quality expectations\nCREATE OR REFRESH STREAMING TABLE silver_orders (\n  CONSTRAINT valid_order_id  EXPECT (order_id IS NOT NULL) ON VIOLATION DROP ROW,\n  CONSTRAINT non_negative    EXPECT (amount &gt;= 0)          ON VIOLATION FAIL UPDATE\n)\nAS SELECT order_id, customer_id, product_id,\n          CAST(order_date AS DATE) AS order_date, quantity, amount, updated_at\nFROM STREAM(bronze_orders);\n\n-- GOLD: materialized view, incremental refresh, self-corrects when silver changes\nCREATE OR REPLACE MATERIALIZED VIEW gold_daily_revenue\nAS SELECT order_date, SUM(amount) AS revenue, COUNT(*) AS orders\nFROM silver_orders\nGROUP BY order_date;\n<\/code><\/pre>\n<p>(These run in a declarative pipeline, formerly Delta Live Tables and now called Lakeflow Spark Declarative Pipelines, or in Databricks SQL. Product names and syntax move between releases, so confirm against current docs.)<\/p>\n<p><strong>Rule of thumb<\/strong>: streaming tables where data is <strong>append-only and processed once<\/strong> (bronze, silver). Materialized views where the answer must <strong>stay correct as inputs change<\/strong> (gold).<\/p>\n<p><strong>Follow-ups<\/strong>\n- <em>Q: Why not a streaming table for gold?<\/em> A: A streaming table won't revise earlier output when a late or corrected row changes a past aggregate. A materialized view recomputes what is affected, so late data fixes the dashboard automatically.\n- <em>Q: What breaks a streaming table?<\/em> A: An upstream update or delete. A streaming read expects append-only, so it fails unless you handle changes (for example the <code>skipChangeCommits<\/code> option, or feed it from a CDC flow instead).\n- <em>Q: Is the materialized view refresh incremental?<\/em> A: Only when the query shape and source tracking allow it; otherwise it falls back to a full recompute. The pipeline event log shows which refresh technique ran, so check it for expensive views.\n- <em>Q: Streaming table or materialized view for silver?<\/em> A: Streaming table when silver is a row-by-row clean/dedupe of append-only bronze. Use a CDC flow (<code>apply_changes<\/code> / <code>AUTO CDC<\/code>) when silver must reflect updates and deletes. Use a materialized view when silver is a join or derived result.\n- <em>Q: Triggered or continuous pipeline?<\/em> A: Triggered (scheduled) is cheapest with minutes of latency. Continuous gives seconds but keeps compute running.<\/p>"}, {"q": "TD3. Where each object belongs in the medallion layers", "a": "<table>\n<thead>\n<tr>\n<th>Layer<\/th>\n<th>Purpose<\/th>\n<th>Typical object<\/th>\n<th>Write pattern<\/th>\n<th>Quality<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Bronze<\/strong><\/td>\n<td>Raw, as received, replayable<\/td>\n<td>Streaming table (Auto Loader)<\/td>\n<td>Append only; add <code>_ingest_ts<\/code>, <code>_source_file<\/code><\/td>\n<td>Minimal; capture bad data, don't reject<\/td>\n<\/tr>\n<tr>\n<td><strong>Silver<\/strong><\/td>\n<td>Clean, deduped, conformed<\/td>\n<td>Streaming table, CDC target, or <code>MERGE<\/code> into Delta<\/td>\n<td>Upsert on business key with <code>updated_at<\/code> guard<\/td>\n<td>Expectations: drop/fail/warn; quarantine bad rows<\/td>\n<\/tr>\n<tr>\n<td><strong>Gold<\/strong><\/td>\n<td>Business-ready aggregates and marts<\/td>\n<td><strong>Materialized view<\/strong> (or Delta table built by job)<\/td>\n<td>Refreshed from silver<\/td>\n<td>Reconcile totals to source<\/td>\n<\/tr>\n<tr>\n<td><strong>Serving<\/strong><\/td>\n<td>BI, apps<\/td>\n<td>Views, Databricks SQL warehouse<\/td>\n<td>Read only<\/td>\n<td>Row/column security<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Follow-ups<\/strong>\n- <em>Q: Where do you deduplicate?<\/em> A: In silver. Bronze stays raw so you can always replay.\n- <em>Q: Where do you handle PII?<\/em> A: Mask or tokenize at silver, use Unity Catalog column masks and row filters for gold and serving.\n- <em>Q: Bronze data is wrong. Do you fix bronze?<\/em> A: No. Bronze is the immutable record. Fix the logic downstream and replay from bronze.<\/p>"}, {"q": "TD4. Ingestion: Auto Loader and `COPY INTO`", "a": "<ul>\n<li><strong>Auto Loader<\/strong> (<code>cloudFiles<\/code>) incrementally discovers new files with a checkpoint. Modes: directory listing (simple) or file notification (S3 events plus SQS; better at very high file counts).<\/li>\n<li><strong>Schema handling<\/strong>: <code>cloudFiles.schemaLocation<\/code> stores inferred schema; <code>schemaEvolutionMode<\/code> = <code>addNewColumns<\/code> (default) or <code>rescue<\/code> (unexpected data goes to <code>_rescued_data<\/code>).<\/li>\n<li><strong>Batch-style<\/strong>: <code>.trigger(availableNow=True)<\/code> processes everything pending and stops, so it runs as a cheap scheduled job.<\/li>\n<li><strong><code>COPY INTO<\/code><\/strong> is idempotent for simpler, smaller file loads; Auto Loader scales better.<\/li>\n<\/ul>\n<pre><code class=\"language-python\">(spark.readStream.format(&quot;cloudFiles&quot;)\n   .option(&quot;cloudFiles.format&quot;, &quot;json&quot;)\n   .option(&quot;cloudFiles.schemaLocation&quot;, &quot;s3://lake/schemas/orders&quot;)\n   .option(&quot;cloudFiles.schemaEvolutionMode&quot;, &quot;rescue&quot;)\n   .load(&quot;s3://lake/raw/orders/&quot;)\n   .writeStream\n   .option(&quot;checkpointLocation&quot;, &quot;s3://lake/chk/bronze_orders&quot;)\n   .trigger(availableNow=True)\n   .toTable(&quot;bronze.orders&quot;))\n<\/code><\/pre>\n<p><strong>Follow-ups<\/strong>\n- <em>Q: Auto Loader vs plain Spark <code>read<\/code>?<\/em> A: Auto Loader tracks which files it has processed, scales file discovery, and handles schema evolution. A plain read rescans everything.\n- <em>Q: You need to reprocess all files?<\/em> A: Use a new checkpoint location (or reset it) and write to a new or truncated target, with the rest of the pipeline idempotent.<\/p>"}, {"q": "TD5. Table maintenance, governance and orchestration", "a": "<ul>\n<li><strong>Maintenance<\/strong>: <code>OPTIMIZE<\/code> (compaction), liquid clustering on common filter and join keys, <code>VACUUM<\/code> with retention that preserves the time-travel window you need.<\/li>\n<li><strong>Governance<\/strong>: Unity Catalog for permissions, lineage, column masks and row filters; tags for PII.<\/li>\n<li><strong>Orchestration<\/strong>: Databricks Workflows (Jobs) for Databricks-only chains; Airflow with Databricks operators for cross-platform pipelines.<\/li>\n<li><strong>Cost<\/strong>: job clusters (not all-purpose) for scheduled work, autoscaling, serverless where it fits, and <code>availableNow<\/code> instead of always-on streams when minutes of latency is fine.<\/li>\n<\/ul>\n<p><strong>Follow-up<\/strong>: <em>Q: Your pipeline cost doubled.<\/em> A: Check for a full refresh or a materialized view falling back to full recompute, small files, an all-purpose cluster running scheduled jobs, skewed joins, and an always-on stream that could be triggered.<\/p>"}], "group": "Tools & skills"}, {"id": "tools-snowflake", "name": "Tools: Snowflake warehouse", "items": [{"q": "TS1. Ingestion: stages, file formats, `COPY INTO`, Snowpipe", "a": "<p><strong>Concepts<\/strong>\n- A <strong>stage<\/strong> is a pointer to files: <strong>internal<\/strong> (inside Snowflake) or <strong>external<\/strong> (S3/Azure/GCS). Use a <strong>storage integration<\/strong> (IAM role, no keys in SQL) for external stages.\n- A <strong>file format<\/strong> describes how to parse files (CSV, JSON, Parquet).\n- <strong><code>COPY INTO &lt;table&gt;<\/code><\/strong> bulk-loads staged files. Snowflake remembers loaded files for about 64 days, so the same file is not loaded twice.\n- <strong>Snowpipe<\/strong> loads continuously as files arrive (auto-ingest from S3 event notifications). <strong>Snowpipe Streaming<\/strong> targets low-latency row ingestion from Kafka or an SDK.<\/p>\n<pre><code class=\"language-sql\">CREATE STORAGE INTEGRATION s3_int\n  TYPE = EXTERNAL_STAGE STORAGE_PROVIDER = 'S3' ENABLED = TRUE\n  STORAGE_AWS_ROLE_ARN = 'arn:aws:iam::123456789012:role/snowflake-read'\n  STORAGE_ALLOWED_LOCATIONS = ('s3://lake/raw/orders/');\n\nCREATE FILE FORMAT ff_parquet TYPE = PARQUET;\n\nCREATE STAGE raw.orders_stage\n  URL = 's3://lake/raw/orders/'\n  STORAGE_INTEGRATION = s3_int\n  FILE_FORMAT = ff_parquet;\n\n-- Dry run: find bad rows without loading\nCOPY INTO raw.orders FROM @raw.orders_stage\n  MATCH_BY_COLUMN_NAME = CASE_INSENSITIVE VALIDATION_MODE = RETURN_ERRORS;\n\n-- Real load\nCOPY INTO raw.orders FROM @raw.orders_stage\n  MATCH_BY_COLUMN_NAME = CASE_INSENSITIVE ON_ERROR = 'SKIP_FILE';\n\n-- Continuous load\nCREATE PIPE raw.orders_pipe AUTO_INGEST = TRUE AS\n  COPY INTO raw.orders FROM @raw.orders_stage\n  MATCH_BY_COLUMN_NAME = CASE_INSENSITIVE;\n<\/code><\/pre>\n<p><strong>Follow-ups<\/strong>\n- <em>Q: A load partially failed. What happens?<\/em> A: Depends on <code>ON_ERROR<\/code>: <code>ABORT_STATEMENT<\/code> (default for <code>COPY<\/code>), <code>SKIP_FILE<\/code>, or <code>CONTINUE<\/code>. Check <code>COPY_HISTORY<\/code> / <code>LOAD_HISTORY<\/code> for per-file status and rejected rows, and keep rejected data for repair.\n- <em>Q: How do you reload a file on purpose?<\/em> A: <code>FORCE = TRUE<\/code> ignores load history and <strong>creates duplicates<\/strong> unless the target is deduped or you clear the data first. State that risk.\n- <em>Q: <code>COPY INTO<\/code> or Snowpipe?<\/em> A: <code>COPY INTO<\/code> for scheduled batch loads you control. Snowpipe for continuous arrival with minutes of latency and serverless compute.\n- <em>Q: A Snowpipe is not loading files.<\/em> A: Check pipe status (<code>SYSTEM$PIPE_STATUS<\/code>), the S3 event notification to the pipe's SQS queue, stage path and permissions, and file format errors in copy history.\n- <em>Q: Semi-structured JSON?<\/em> A: Land it as <code>VARIANT<\/code>, then flatten and cast into typed columns in silver. Typed columns prune and join better.<\/p>"}, {"q": "TS2. Streams and tasks (change capture and scheduled processing)", "a": "<p><strong>Concepts<\/strong>\n- A <strong>stream<\/strong> records changes (inserts, updates, deletes) on a table since it was last consumed. It exposes <code>METADATA$ACTION<\/code>, <code>METADATA$ISUPDATE<\/code> and <code>METADATA$ROW_ID<\/code>. An update appears as a delete plus an insert with <code>ISUPDATE = TRUE<\/code>.\n- A stream's position advances only when <strong>consumed by DML in a committed transaction<\/strong>. A plain <code>SELECT<\/code> does not advance it.\n- A <strong>task<\/strong> runs SQL on a schedule or after another task. <code>WHEN SYSTEM$STREAM_HAS_DATA('stream')<\/code> skips runs when there is nothing new, which saves credits.\n- Tasks are created <strong>suspended<\/strong>; you must <code>RESUME<\/code> them. Task graphs use <code>AFTER<\/code>.<\/p>\n<pre><code class=\"language-sql\">CREATE STREAM raw.orders_stream ON TABLE raw.orders;   -- append_only = true also available\n\nCREATE TASK silver.merge_orders\n  WAREHOUSE = etl_wh\n  SCHEDULE = '5 MINUTE'\n  WHEN SYSTEM$STREAM_HAS_DATA('raw.orders_stream')\nAS\nMERGE INTO silver.orders t\nUSING (\n  SELECT * FROM raw.orders_stream\n  WHERE METADATA$ACTION = 'INSERT'\n  QUALIFY ROW_NUMBER() OVER (PARTITION BY order_id ORDER BY updated_at DESC) = 1\n) s\nON t.order_id = s.order_id\nWHEN MATCHED AND s.updated_at &gt; t.updated_at THEN UPDATE SET\n  t.amount = s.amount, t.status = s.status, t.updated_at = s.updated_at\nWHEN NOT MATCHED THEN INSERT (order_id, customer_id, amount, status, updated_at)\n  VALUES (s.order_id, s.customer_id, s.amount, s.status, s.updated_at);\n\nALTER TASK silver.merge_orders RESUME;\n\n-- A downstream task in the same graph\nCREATE TASK gold.refresh_daily_revenue\n  WAREHOUSE = etl_wh\n  AFTER silver.merge_orders\nAS\n  INSERT OVERWRITE INTO gold.daily_revenue\n  SELECT order_date, SUM(amount) FROM silver.orders GROUP BY order_date;\n<\/code><\/pre>\n<p><strong>Follow-ups<\/strong>\n- <em>Q: What is a stale stream?<\/em> A: If a stream isn't consumed within the source table's data retention (extended up to a limit), its offset is lost and it becomes unusable. Consume regularly and alert on stream age.\n- <em>Q: Why dedupe inside the merge source?<\/em> A: A stream batch can hold several versions of one key, and <code>MERGE<\/code> errors (or behaves nondeterministically) with multiple matching source rows.\n- <em>Q: Standard vs append-only streams?<\/em> A: Standard captures inserts, updates and deletes. Append-only captures inserts only, which is cheaper for pure event logs.\n- <em>Q: Serverless or warehouse tasks?<\/em> A: Serverless tasks scale compute automatically with no idle warehouse. A named warehouse gives you control and shared capacity. Both need monitoring through task history.\n- <em>Q: Task failed halfway through the graph?<\/em> A: Check <code>TASK_HISTORY<\/code>; fix and rerun. Because the stream only advances on commit, a failed <code>MERGE<\/code> leaves changes unconsumed, so the next run picks them up (idempotent by design).\n- <em>Q: Streams and tasks or dynamic tables?<\/em> A: See TS3.<\/p>"}, {"q": "TS3. Dynamic tables and materialized views (incremental transformation)", "a": "<ul>\n<li><strong>Dynamic table<\/strong>: you declare the query and a <code>TARGET_LAG<\/code>; Snowflake keeps it refreshed, incrementally when it can. It replaces many stream-and-task pairs for declarative pipelines.<\/li>\n<li><strong>Materialized view<\/strong>: precomputed result of a <strong>single-table<\/strong> query, maintained automatically. Good for repeated aggregates on one table; limited functions, no joins.<\/li>\n<\/ul>\n<pre><code class=\"language-sql\">CREATE OR REPLACE DYNAMIC TABLE gold.daily_revenue\n  TARGET_LAG = '15 minutes'\n  WAREHOUSE = etl_wh\nAS\nSELECT order_date, region, SUM(amount) AS revenue, COUNT(*) AS orders\nFROM silver.orders\nGROUP BY order_date, region;\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n<th>Need<\/th>\n<th>Use<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Declarative pipeline with a freshness target<\/td>\n<td>Dynamic table<\/td>\n<\/tr>\n<tr>\n<td>Custom logic (conditional deletes, side effects, calling procedures)<\/td>\n<td>Streams + tasks<\/td>\n<\/tr>\n<tr>\n<td>Fast repeated aggregate on one table<\/td>\n<td>Materialized view<\/td>\n<\/tr>\n<tr>\n<td>Load files continuously<\/td>\n<td>Snowpipe<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Follow-ups<\/strong>\n- <em>Q: Late-arriving data in a dynamic table?<\/em> A: It refreshes from the current source, so a corrected or late silver row updates the affected aggregates on the next refresh. That makes dynamic tables (like Databricks materialized views) a good fit for gold.\n- <em>Q: What controls cost?<\/em> A: <code>TARGET_LAG<\/code> (shorter lag means more refreshes), refresh mode (incremental vs full), and the warehouse size. Check refresh history for fallbacks to full refresh.<\/p>"}, {"q": "TS4. Data warehouse concepts to know cold", "a": "<ul>\n<li><strong>Storage and compute separate<\/strong>: data lives in micro-partitions on cloud storage; <strong>virtual warehouses<\/strong> are independent compute. Scale up for heavy queries, scale out (multi-cluster) for concurrency, separate warehouses for ETL, BI and ad hoc.<\/li>\n<li><strong>Pruning<\/strong>: micro-partition min/max metadata lets queries skip data. A <strong>clustering key<\/strong> helps on large tables filtered by the same columns.<\/li>\n<li><strong>Dimensional model<\/strong>: star schema with a <strong>fact table at a stated grain<\/strong> (one row per order line) and <strong>dimensions<\/strong> with surrogate keys. SCD Type 2 keeps history with <code>valid_from<\/code>, <code>valid_to<\/code>, <code>is_current<\/code>.<\/li>\n<li><strong>Recovery<\/strong>: <strong>Time Travel<\/strong> (query or restore past data within retention), <strong>zero-copy clone<\/strong> (instant test or backup copy), <code>UNDROP<\/code>, <strong>Fail-safe<\/strong> (Snowflake-managed recovery window, not user-accessible).<\/li>\n<li><strong>Sharing and security<\/strong>: role-based access, dynamic data masking, row access policies, secure data sharing without copying.<\/li>\n<\/ul>\n<pre><code class=\"language-sql\">-- Backfill safely: clone, fix, validate, swap\nCREATE TABLE silver.orders_fix CLONE silver.orders;\n-- ... apply corrected logic to silver.orders_fix and compare totals ...\nALTER TABLE silver.orders SWAP WITH silver.orders_fix;\n\n-- Recover from a bad write\nCREATE TABLE silver.orders_restored CLONE silver.orders AT (OFFSET =&gt; -3600);\n<\/code><\/pre>\n<p><strong>Follow-ups<\/strong>\n- <em>Q: How do you handle a late-arriving dimension?<\/em> A: Insert an inferred placeholder row (<code>is_inferred = true<\/code>) so facts load, then update it when the real row arrives. For SCD2, restate the validity ranges.\n- <em>Q: Backfill without risking production?<\/em> A: Clone, rebuild on the clone, reconcile counts and sums, then <code>SWAP<\/code>. Keep the old table briefly as a rollback.\n- <em>Q: Why can Time Travel not save you forever?<\/em> A: Retention is limited (1 day by default, up to 90 on higher editions), and Fail-safe is for Snowflake-assisted recovery only. For long-term history keep snapshots or raw files.<\/p>"}], "group": "Tools & skills"}, {"id": "tools-cheat-sheet", "name": "Tools: cheat sheet", "items": [{"q": "TC1. Which tool solves which problem", "a": "<table>\n<thead>\n<tr>\n<th>Problem<\/th>\n<th>AWS (Glue / Airflow)<\/th>\n<th>Databricks<\/th>\n<th>Snowflake<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Ingest files<\/strong><\/td>\n<td>Glue + bookmarks; Firehose to S3<\/td>\n<td>Auto Loader into a streaming table<\/td>\n<td>Stage + <code>COPY INTO<\/code>, Snowpipe<\/td>\n<\/tr>\n<tr>\n<td><strong>Ingest stream<\/strong><\/td>\n<td>Kinesis/MSK + Lambda or Glue streaming<\/td>\n<td>Structured Streaming / streaming table<\/td>\n<td>Snowpipe Streaming, Kafka connector<\/td>\n<\/tr>\n<tr>\n<td><strong>Upsert / dedupe<\/strong><\/td>\n<td>Dedupe in Spark; load to warehouse with staging + merge<\/td>\n<td><code>MERGE INTO<\/code>, <code>apply_changes<\/code> / <code>AUTO CDC<\/code><\/td>\n<td>Stream + task + <code>MERGE<\/code><\/td>\n<\/tr>\n<tr>\n<td><strong>Late data<\/strong><\/td>\n<td>Lookback window, partition overwrite<\/td>\n<td>Silver <code>MERGE<\/code> with <code>updated_at<\/code> guard; gold materialized view self-corrects<\/td>\n<td>Dynamic table refresh; merge with timestamp guard<\/td>\n<\/tr>\n<tr>\n<td><strong>Data quality<\/strong><\/td>\n<td>Glue Data Quality (DQDL), Airflow check tasks<\/td>\n<td>Expectations (<code>EXPECT ... ON VIOLATION<\/code>), quarantine table<\/td>\n<td><code>VALIDATION_MODE<\/code>, <code>ON_ERROR<\/code>, tests (dbt) before publish<\/td>\n<\/tr>\n<tr>\n<td><strong>Backfill<\/strong><\/td>\n<td>Parameterized run + Airflow backfill, bookmark reset<\/td>\n<td>Replay from bronze, <code>RESTORE<\/code>, <code>replaceWhere<\/code><\/td>\n<td>Clone + rebuild + <code>SWAP<\/code>, Time Travel<\/td>\n<\/tr>\n<tr>\n<td><strong>Orchestration<\/strong><\/td>\n<td>Airflow (MWAA), Step Functions<\/td>\n<td>Workflows, or Airflow operators<\/td>\n<td>Tasks and task graphs, or Airflow<\/td>\n<\/tr>\n<tr>\n<td><strong>Incremental serving layer<\/strong><\/td>\n<td>Redshift staging merge<\/td>\n<td><strong>Materialized views / streaming tables<\/strong><\/td>\n<td><strong>Dynamic tables<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"q": "TC2. Skills to claim, and how to prove each one", "a": "<table>\n<thead>\n<tr>\n<th>Skill<\/th>\n<th>Say it like this<\/th>\n<th>Prove it with<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Idempotent pipelines<\/td>\n<td>\"Every load is a partition overwrite or a keyed <code>MERGE<\/code>, so reruns are safe.\"<\/td>\n<td>A rerun or backfill you did without duplicates<\/td>\n<\/tr>\n<tr>\n<td>Late data<\/td>\n<td>\"Event-time logic, watermark or lookback window, and a gold layer that recomputes.\"<\/td>\n<td>Lateness window you chose and why<\/td>\n<\/tr>\n<tr>\n<td>Data quality<\/td>\n<td>\"Validate early, quarantine with a reason, alert on rate.\"<\/td>\n<td>A reject rate you tracked, an incident it caught<\/td>\n<\/tr>\n<tr>\n<td>Backfill and recovery<\/td>\n<td>\"Parameterized by date, built on a shadow copy, validated, then swapped.\"<\/td>\n<td>Rows or days restated, and how you verified<\/td>\n<\/tr>\n<tr>\n<td>Streaming<\/td>\n<td>\"At-least-once delivery plus an idempotent sink gives effectively-once.\"<\/td>\n<td>Throughput, lag, and a lag incident you fixed<\/td>\n<\/tr>\n<tr>\n<td>Cost and performance<\/td>\n<td>\"Right-size compute, fix skew and small files, prefer incremental over full.\"<\/td>\n<td>Before/after cost or runtime numbers<\/td>\n<\/tr>\n<tr>\n<td>Governance and PII<\/td>\n<td>\"Tokenize at ingestion, mask by role, audit access.\"<\/td>\n<td>The control you implemented and the data it covered<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"q": "TC3. Phrases that land in an interview", "a": "<ul>\n<li>\"Bronze is immutable, so any bug downstream is fixable by replay.\"<\/li>\n<li>\"Streaming tables for append-only ingestion, materialized views where the answer must stay correct as inputs change.\"<\/li>\n<li>\"A stream only advances on a committed consume, so a failed merge simply retries the same changes.\"<\/li>\n<li>\"A green job is not correct data, so I add data checks as pipeline steps.\"<\/li>\n<li>\"I choose the tool by the guarantee I need: ordering, latency, replay, or cost.\"<\/li>\n<\/ul>"}], "group": "Tools & skills"}, {"id": "practice", "name": "Practice", "items": [{"q": "Mock interview prompt", "a": "<pre><code>Act as a senior data engineering interviewer for a Senior Data Engineer / AI Engineer role.\nTopics: Spark performance &amp; configs, Delta Lake, Delta Live Tables, Snowflake performance, SQL, LLM/RAG pipelines.\nDataset: ecommerce orders (order_id, customer_id, product_id, order_date, quantity, amount, status, updated_at), 2B rows.\nRules:\n1. Ask ONE scenario question at a time; start easy, increase difficulty based on my answers.\n2. Wait for my answer. Then score it 1-5 on correctness, depth, trade-offs, and communication.\n3. Show the ideal answer (with code/config), what I missed, and ONE follow-up question.\n4. After 8 questions give a summary of strengths, gaps, and a 1-week study plan.\nStart with: &quot;Choose a topic: Spark, Delta, DLT, Snowflake, SQL, or AI — or say 'mixed'.&quot;\n<\/code><\/pre>"}, {"q": "Answers worth memorising", "a": "<ul>\n<li><strong>Skew:<\/strong> \"Find the hot key in the Spark UI, enable AQE skew join, otherwise isolate hot keys or salt; NULL keys are the usual culprit.\"<\/li>\n<li><strong>Broadcast:<\/strong> \"Broadcast only the small side that fits comfortably in executor memory; never a table that could grow.\"<\/li>\n<li><strong>Delta dedupe:<\/strong> \"Dedupe the batch with ROW_NUMBER, MERGE on business key with an updated_at guard, so it's idempotent.\"<\/li>\n<li><strong>Snowflake:<\/strong> \"Clustering for pruning on range filters, MV for repeated aggregates, Search Optimization for point lookups, cache for repeated identical queries, bigger warehouse for spill.\"<\/li>\n<li><strong>DLT:<\/strong> \"Declarative pipeline; expectations for quality; APPLY CHANGES with sequence_by for CDC; streaming tables for ingestion, materialized views for gold.\"<\/li>\n<\/ul>\n<p><em>Caveat: config defaults and feature names (Liquid Clustering, Lakeflow, deletion vectors, Cortex) change with releases — confirm against current Databricks/Snowflake docs before an interview.<\/em><\/p>"}], "group": "Practice"}]};
const COLORS = {spark:'--c-spark','delta-lake':'--c-delta','delta-live-tables':'--c-dlt','snowflake-performance':'--c-snow','sql-on-the-order-table':'--c-sql','ai-engineering':'--c-ai','architecture-and-incidents':'--c-arch','practice':'--c-practice','answer-framework':'--c-answer-framework','track-a-batch-streaming':'--c-track-a-batch-streaming','track-b-warehouse':'--c-track-b-warehouse','track-c-medallion':'--c-track-c-medallion','aws-track':'--c-aws-track','incident-scenarios':'--c-incident-scenarios','architecture-comparison':'--c-architecture-comparison','tools-aws-glue-airflow':'--c-tools-aws-glue-airflow','tools-databricks':'--c-tools-databricks','tools-snowflake':'--c-tools-snowflake','tools-cheat-sheet':'--c-tools-cheat-sheet','architecture':'--c-architecture','sc-ingestion':'--c-sc-ingestion','sc-late-data':'--c-sc-late-data','sc-backfill':'--c-sc-backfill','sc-data-quality':'--c-sc-data-quality','sc-troubleshooting':'--c-sc-troubleshooting','sc-hard':'--c-sc-hard'};
const cats = DATA.cats;
const col = c => `var(${COLORS[c.id]||'--c-practice'})`;
let done = {};
try { done = JSON.parse(localStorage.getItem('de-done')||'{}'); } catch(e){}
const save = () => { try { localStorage.setItem('de-done', JSON.stringify(done)); } catch(e){} };
const key = (c,i) => c.id+':'+i;
const plain = h => { const d=document.createElement('div'); d.innerHTML=h; return d.textContent.toLowerCase(); };
cats.forEach(c => c.items.forEach(i => i.text = (i.q+' '+(i.tag||'')+' '+plain(i.a)).toLowerCase()));
const total = cats.reduce((n,c)=>n+c.items.length,0);
const valid = new Set(); cats.forEach(c=>c.items.forEach((i,x)=>valid.add(c.id+':'+x)));
const tagc = t => 't-'+String(t).split(' ')[0];
const tagh = i => i.tag?`<span class="tag ${tagc(i.tag)}">${i.tag}</span>`:'';
const grouped = f => { let g='',o=''; cats.forEach(c=>{ if(c.group!==g){ g=c.group; o+=f.h(g); } o+=f.i(c); }); return o; };
const $ = s => document.querySelector(s);
let view = 'home', term = '';

function nav(){
  $('#nav').innerHTML = `<li><button data-v="home" ${view==='home'&&!term?'aria-current="true"':''}><span class="dot" style="--col:#9fb3c8"></span>All categories<span class="n">${total}</span></button></li>` +
   grouped({h:g=>`<li class="gl">${g}</li>`,i:c=>`<li><button data-v="${c.id}" ${view===c.id&&!term?'aria-current="true"':''}><span class="dot" style="--col:${col(c)}"></span>${c.name}<span class="n">${c.items.length}</span></button></li>`});
  const n = Object.keys(done).filter(k=>done[k]&&valid.has(k)).length;
  $('#ptxt').textContent = `${n} of ${total} reviewed`;
  $('#pbar').style.width = (n/total*100)+'%';
}
function card(c,i,idx,open){
  const k = key(c,idx);
  return `<details class="q" style="--col:${col(c)}" ${open?'open':''}><summary><span class="qt">${i.q}${tagh(i)}${term?`<span class="crumb">${c.name}</span>`:''}</span><label class="done" onclick="event.stopPropagation()"><input type="checkbox" data-k="${k}" ${done[k]?'checked':''}> Reviewed</label></summary><div class="body">${i.a}</div></details>`;
}
function render(){
  const m = $('#main');
  if(term){
    const hits=[]; cats.forEach(c=>c.items.forEach((i,idx)=>{ if(term.split(/\s+/).every(w=>i.text.includes(w))) hits.push(card(c,i,idx,false)); }));
    m.innerHTML = `<h1>Search results</h1><p class="lede">${hits.length} match${hits.length===1?'':'es'} for “${term.replace(/</g,'&lt;')}”</p>` + (hits.join('')||'<p class="empty">No questions match. Try a shorter term such as “skew” or “merge”.</p>');
  } else if(view==='home'){
    m.innerHTML = `<h1>Data engineering interview bank</h1><p class="lede">Core topics (Spark, Delta Lake, Delta Live Tables, Snowflake, SQL, AI engineering), then architecture patterns and scenarios grouped by type: ingestion and loading with fallback, late and slow data, backfill and backtracking, data quality, troubleshooting, and hard scenarios to memorize. Each scenario shows the same problem across AWS, lakehouse, Snowflake and warehouse stacks, with interviewer follow-ups. Tools and skills cover Glue, Airflow, Databricks and Snowflake.</p>
    <div class="tiles">${grouped({h:g=>`<h2 class="gh">${g}</h2>`,i:c=>`<button class="tile" style="--col:${col(c)}" data-v="${c.id}"><h3>${c.name}</h3><p>${c.items.length} ${c.items.length===1?'topic':'questions'}: ${c.items.slice(0,2).map(i=>i.q).join(', ')}</p></button>`})}</div>
    <div class="model">${DATA.intro}</div>`;
  } else {
    const c = cats.find(x=>x.id===view);
    m.innerHTML = `<h1>${c.name}</h1><p class="lede">${c.items.length} ${c.items.length===1?'topic':'questions'}. Open one, answer it out loud first, then check the answer.</p>
    <div class="tools"><button class="btn" id="ex">Expand all</button><button class="btn" id="co">Collapse all</button></div>` + c.items.map((i,idx)=>card(c,i,idx,false)).join('');
    $('#ex').onclick=()=>m.querySelectorAll('details').forEach(d=>d.open=true);
    $('#co').onclick=()=>m.querySelectorAll('details').forEach(d=>d.open=false);
  }
  m.querySelectorAll('pre').forEach(p=>{ const b=document.createElement('button'); b.className='copy'; b.textContent='Copy'; b.onclick=()=>{ navigator.clipboard.writeText(p.innerText.replace(/Copy$/,'').trim()).then(()=>{b.textContent='Copied';setTimeout(()=>b.textContent='Copy',1500)}).catch(()=>{b.textContent='Select and copy'}); }; p.appendChild(b); });
  nav();
}
document.addEventListener('click',e=>{
  const v = e.target.closest('[data-v]'); if(v){ view=v.dataset.v; term=''; $('#s').value=''; history.replaceState(null,'','#'+view); render(); window.scrollTo(0,0); }
});
document.addEventListener('change',e=>{ const k=e.target.dataset&&e.target.dataset.k; if(k){ done[k]=e.target.checked; save(); nav(); } });
$('#s').addEventListener('input',e=>{ term=e.target.value.trim().toLowerCase(); render(); });
const h = location.hash.slice(1); if(cats.some(c=>c.id===h)) view=h;
render();
</script>
</body>
</html>
